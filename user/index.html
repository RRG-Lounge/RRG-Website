<!DOCTYPE html>

<title>RRG Lounge — Staff Queue View</title>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #121212; color: #eee; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 24px; }
  .login-brand { font-size: 22px; font-weight: 700; color: #e6be50; text-align: center; margin-bottom: 4px; }
  .login-sub { text-align: center; color: #999; font-size: 13px; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #ccc; margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #0f0f0f; color: #eee; font-size: 16px; }
  .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; background: #e6be50; color: #1a1a1a; font-weight: 700; font-size: 16px; cursor: pointer; }
  .btn:disabled { opacity: 0.5; }
  .btn-outline { background: transparent; border: 1px solid #555; color: #eee; }
  .login-error { color: #ff8080; font-size: 13px; margin-top: 10px; text-align: center; min-height: 16px; }
  .topbar { position: sticky; top: 0; background: #1a1a1a; border-bottom: 1px solid #333; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
  .topbar b { color: #e6be50; }
  .topbar button { background: transparent; border: 1px solid #555; color: #ccc; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  .content { padding: 12px 14px 40px; }
  .section-title { font-size: 14px; font-weight: 700; color: #e6be50; text-transform: uppercase; letter-spacing: 0.5px; margin: 18px 0 8px; }
  .queue-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .queue-card.called { opacity: 0.55; }
  .queue-label { font-size: 17px; font-weight: 700; }
  .queue-meta { font-size: 13px; color: #aaa; margin-top: 3px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px; margin-top: 6px; margin-right: 5px; }
  .badge-paid { background: #1f4d2b; color: #7ee08c; }
  .badge-unpaid { background: #4d2f1f; color: #e0a87e; }
  .badge-called { background: #333; color: #ccc; }
  .badge-assigned { background: #4a3a15; color: #e6be50; }
  .assign-note { font-size: 12px; color: #999; margin: 8px 0 4px; }
  .call-btn { margin-top: 10px; width: 100%; padding: 10px; border-radius: 7px; border: 1px solid #e6be50; background: transparent; color: #e6be50; font-weight: 600; font-size: 14px; }
  .call-btn.done { border-color: #555; color: #999; }
  .queue-card select { width: 100%; margin-top: 8px; padding: 10px; border-radius: 7px; border: 1px solid #444; background: #0f0f0f; color: #eee; font-size: 14px; }
  .empty-note { color: #888; font-size: 14px; padding: 20px 0; text-align: center; }
  .chair-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #262626; font-size: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .dot-free { background: #7ee08c; } .dot-busy { background: #e0a87e; }
  .tabbar { display: flex; border-bottom: 1px solid #333; }
  .tabbar .tab { flex: 1; text-align: center; padding: 13px 0; font-size: 14px; font-weight: 700; color: #999; border-bottom: 3px solid transparent; }
  .tabbar .tab.active { color: #e6be50; border-bottom-color: #e6be50; }
  .unit-group { margin-bottom: 16px; }
  .unit-group-label { font-weight: 700; margin-bottom: 8px; }
  .unit-group-label.chair { color: #cda53a; } .unit-group-label.leg { color: #3fa9c9; } .unit-group-label.advleg { color: #a569d4; } .unit-group-label.other { color: #d4783a; }
  .pkg-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .pkg-btn { padding: 10px 14px; border-radius: 8px; border: none; font-weight: 700; font-size: 14px; color: #141414; }
  .pkg-btn.chair { background: #cda53a; } .pkg-btn.leg { background: #3fa9c9; } .pkg-btn.advleg { background: #a569d4; } .pkg-btn.other { background: #d4783a; }
  .cart-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #262626; font-size: 14px; }
  .cart-line button { background: transparent; border: none; color: #e08080; font-size: 13px; }
  .pay-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .pay-btn { flex: 1; min-width: 70px; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: #ccc; font-size: 13px; font-weight: 600; }
  .pay-btn.selected { background: #e6be50; color: #1a1a1a; border-color: #e6be50; }
  .wait-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #262626; font-size: 14px; }
</style>

<body>
<div id="root"></div>
<script>
"use strict";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA6BnYGNx3hKNcSxHgN9Wpyz6LkB_MUKq4",
  authDomain: "rrg-lounge-os.firebaseapp.com",
  projectId: "rrg-lounge-os",
  storageBucket: "rrg-lounge-os.firebasestorage.app",
  messagingSenderId: "1071966836969",
  appId: "1:1071966836969:web:e433f87d2d05748e573878"
};
firebase.initializeApp(FIREBASE_CONFIG);
const fbAuth = firebase.auth();
const fsDb = firebase.firestore();

// Deliberately narrow scope: this page only ever reads/writes waitingQueue (marking someone
// "called") and reads sessions (to show which chairs are free). It never touches checkout,
// payments, or printing -- those still happen at the desk, where the printer and cash drawer
// actually are. Same Firebase Auth login as the main dashboard (Staff ID + PIN), same Firestore
// Rules already deployed -- no new backend permissions needed for this page to work.

let currentUser = null;
let _visibilityListenerAdded = false;
let unsubQueue = null, unsubSessions = null, unsubConfig = null;
let queueRows = [], sessionRows = [], liveConfig = {
  chairOrder: [], disabledUnits: [], unitTypes: {}, packages: {}, paymentMethods: [],
  defaultPaymentMethod: "UPI", invoicePrefix: "RRG", gstEnabled: false, gstRate: 18, gstin: "",
  mobileBookingEnabled: false
};
let activeTab = "assign";
let cart = []; // { unitType, packageLabel, durationMin, price }
let cartPayment = "UPI";
let cartCustomerName = "", cartCustomerPhone = "";
let _lastLocalId = 0;
let checkoutInFlight = false;

function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function unitTypeOf(name){
  if (liveConfig.unitTypes && liveConfig.unitTypes[name]) return liveConfig.unitTypes[name];
  return name.startsWith("Leg") ? "Leg" : "Chair";
}
function freeMatchingChairs(unitType){
  const disabled = liveConfig.disabledUnits || [];
  const busy = new Set(sessionRows.map(s => s.chairName));
  return (liveConfig.chairOrder || []).filter(c => !disabled.includes(c) && unitTypeOf(c) === unitType && !busy.has(c));
}

function buildLogin(errorMsg){
  document.getElementById("root").innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-brand">RRG Lounge</div>
        <div class="login-sub">Staff Queue View</div>
        <div class="field"><label>Staff ID</label><input id="loginId" autocapitalize="off"></div>
        <div class="field"><label>PIN</label><input id="loginPin" type="password" inputmode="numeric"></div>
        <button class="btn" id="loginBtn">Login</button>
        <div class="login-error">${errorMsg ? escapeHtml(errorMsg) : ""}</div>
      </div>
    </div>`;
  document.getElementById("loginBtn").addEventListener("click", doLogin);
  document.getElementById("loginPin").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
}

async function doLogin(){
  const staffId = document.getElementById("loginId").value.trim();
  const pin = document.getElementById("loginPin").value;
  if (!staffId || !pin) { buildLogin("Enter your Staff ID and PIN."); return; }
  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  try {
    const email = `${staffId}@rrglounge.local`;
    const cred = await fbAuth.signInWithEmailAndPassword(email, pin);
    const token = await cred.user.getIdTokenResult(true);
    if (token.claims.active !== true) { await fbAuth.signOut(); buildLogin("This account has been disabled. Please see Admin."); return; }
    if (!token.claims.role) { await fbAuth.signOut(); buildLogin("Account isn't fully set up yet. Please see Admin."); return; }
    if (token.claims.role === "mall_admin") { await fbAuth.signOut(); buildLogin("This page is for staff use only. Please use the Mall Admin Portal instead."); return; }
    currentUser = { uid: cred.user.uid, role: token.claims.role, staffId };
    buildApp();
  } catch (e) {
    let msg = "Couldn't sign in. Please try again.";
    if (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential" || e.code === "auth/invalid-login-credentials") msg = "Incorrect PIN.";
    else if (e.code === "auth/user-not-found") msg = "Staff ID not found.";
    else if (e.code === "auth/network-request-failed") msg = "No internet connection.";
    buildLogin(msg);
  }
}

function buildApp(){
  document.getElementById("root").innerHTML = `
    <div class="topbar">
      <div><b>RRG Lounge</b> &middot; Queue View</div>
      <button id="logoutBtn">Logout</button>
    </div>
    <div class="tabbar" id="tabBar"></div>
    <div class="content" id="assignContent">
      <div class="section-title">Waiting Queue</div>
      <div id="queueList"></div>
      <div class="section-title">Chair Status</div>
      <div id="chairList"></div>
    </div>
    <div class="content" id="bookContent" style="display:none;"></div>`;
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    if (unsubQueue) unsubQueue();
    if (unsubSessions) unsubSessions();
    if (unsubConfig) unsubConfig();
    currentUser = null;
    await fbAuth.signOut();
    buildLogin();
  });

  unsubConfig = fsDb.collection("meta").doc("config").onSnapshot(doc => {
    const data = doc.data() || {};
    const config = data.value || {}; // stored as {key:"config", value:{...actual settings...}}, not flat
    liveConfig = {
      chairOrder: config.chairOrder || [], disabledUnits: config.disabledUnits || [], unitTypes: config.unitTypes || {},
      packages: config.packages || {}, paymentMethods: config.paymentMethods || [],
      defaultPaymentMethod: config.defaultPaymentMethod || "UPI", invoicePrefix: config.invoicePrefix || "RRG",
      gstEnabled: !!config.gstEnabled, gstRate: config.gstRate || 18, gstin: config.gstin || "",
      mobileBookingEnabled: !!config.mobileBookingEnabled
    };
    if (!liveConfig.mobileBookingEnabled && activeTab === "book") activeTab = "assign"; // if turned off while someone's on it, drop them back to Assign
    renderTabBar();
    renderQueue(); // chair availability may have changed
    if (activeTab === "book") renderBookTab();
  });

  // Real-time listeners, not polling -- Firestore only counts an actual document read when
  // something genuinely changes, which is far cheaper (and far more instant) than this page
  // re-fetching everything on a timer all day.
  unsubQueue = fsDb.collection("waitingQueue").onSnapshot(snap => {
    queueRows = snap.docs.map(d => Object.assign({}, d.data(), { id: parseInt(d.id, 10) }));
    renderQueue();
  }, err => { document.getElementById("queueList").innerHTML = `<div class="empty-note">Couldn't load queue: ${escapeHtml(err.message)}</div>`; });

  unsubSessions = fsDb.collection("sessions").where("status", "==", "running").onSnapshot(snap => {
    sessionRows = snap.docs.map(d => d.data());
    renderChairs();
  }, err => { document.getElementById("chairList").innerHTML = `<div class="empty-note">Couldn't load chair status: ${escapeHtml(err.message)}</div>`; });

  // Phones aggressively pause background network activity to save battery -- the tab can stay
  // "open" while its live connection silently goes stale (screen locked, app switched away from
  // for a while). The listeners above should self-heal on their own, but that isn't always
  // prompt or reliable in practice -- so force one fresh, explicit read the moment the screen
  // actually comes back on, guaranteeing correctness right when someone's about to act on it,
  // rather than trusting a background reconnection that may still be catching up. Guarded
  // against duplicates since buildApp() runs again on every fresh login, not just once per page.
  if (!_visibilityListenerAdded) {
    _visibilityListenerAdded = true;
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState !== "visible" || !currentUser) return;
      try {
        const [queueSnap, sessionSnap] = await Promise.all([
          fsDb.collection("waitingQueue").get(),
          fsDb.collection("sessions").where("status", "==", "running").get()
        ]);
        queueRows = queueSnap.docs.map(d => Object.assign({}, d.data(), { id: parseInt(d.id, 10) }));
        sessionRows = sessionSnap.docs.map(d => d.data());
        renderQueue();
        renderChairs();
      } catch (e) { /* the live listeners will keep trying regardless -- this was just a bonus freshness check */ }
    });
  }
  renderTabBar();
}

function renderTabBar(){
  const el = document.getElementById("tabBar");
  if (!el) return;
  const tabs = [{ id: "assign", label: "Assign" }];
  if (liveConfig.mobileBookingEnabled) tabs.push({ id: "book", label: "Book" });
  el.innerHTML = tabs.map(t => `<div class="tab${t.id === activeTab ? " active" : ""}" data-tab="${t.id}">${t.label}</div>`).join("");
  el.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));
}

function switchTab(tab){
  activeTab = tab;
  renderTabBar();
  document.getElementById("assignContent").style.display = tab === "assign" ? "" : "none";
  document.getElementById("bookContent").style.display = tab === "book" ? "" : "none";
  if (tab === "book") renderBookTab();
}

function renderQueue(){
  const el = document.getElementById("queueList");
  if (!el) return;
  if (!queueRows.length) { el.innerHTML = `<div class="empty-note">No one waiting right now.</div>`; return; }
  const sorted = queueRows.slice().sort((a,b) => (a.addedAt||0) - (b.addedAt||0));
  el.innerHTML = sorted.map(q => {
    const freeChairs = freeMatchingChairs(q.unitType);
    return `
    <div class="queue-card ${q.called ? "called" : ""}">
      <div class="queue-label">${escapeHtml(q.label || "Token")}</div>
      <div class="queue-meta">${escapeHtml(q.unitType || "")} \u00b7 ${escapeHtml(q.packageLabel || "")}${q.customerName ? " \u00b7 " + escapeHtml(q.customerName) : ""}</div>
      <span class="badge ${q.paid ? "badge-paid" : "badge-unpaid"}">${q.paid ? "Paid" : "Not yet paid"}</span>
      ${q.called ? `<span class="badge badge-called">Called</span>` : ""}
      <button class="call-btn ${q.called ? "done" : ""}" data-action="call" data-id="${q.id}">${q.called ? "Marked as Called \u2014 tap to undo" : "Mark as Called"}</button>
      ${freeChairs.length ? `
        <select data-action="start" data-id="${q.id}">
          <option value="">Start on a chair\u2026</option>
          ${freeChairs.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("")}
        </select>
      ` : `<p class="assign-note">No matching unit free right now.</p>`}
    </div>
  `;
  }).join("");
  el.querySelectorAll(".call-btn").forEach(b => b.addEventListener("click", async () => {
    const id = parseInt(b.dataset.id, 10);
    const q = queueRows.find(x => x.id === id);
    if (!q) return;
    b.disabled = true;
    try {
      await fsDb.collection("waitingQueue").doc(String(id)).update({ called: !q.called, calledAt: !q.called ? Date.now() : null, calledBy: !q.called ? currentUser.staffId : null });
    } catch (e) {
      if (e.code === "not-found") alert("This token has already been started (by the desk or another phone) \u2014 it's no longer in the waiting queue.");
      else alert("Couldn't update: " + e.message);
    }
    b.disabled = false;
  }));
  el.querySelectorAll('select[data-action="start"]').forEach(sel => sel.addEventListener("change", async () => {
    const id = parseInt(sel.dataset.id, 10);
    const chairName = sel.value;
    if (!chairName) return;
    const ok = await startFromQueue(id, chairName);
    if (!ok) sel.value = ""; // reset the dropdown if it was cancelled or failed, so it doesn't look like it went through
  }));
}

// Directly starts the session -- the SAME real action the desk's "Start on Chair" button
// performs, not just a suggestion this time. A confirmation showing the exact token, customer
// name, package, and chair is the safety net here: it's the moment to catch "wait, that's the
// wrong chair" or "that's not who's actually here" before anything is locked in. Deliberately
// does NOT touch payment or printing -- that already happened at checkout; starting is purely
// a status change (chair assigned, timer begins), same as the desktop.
async function startFromQueue(qid, chairName){
  const q = queueRows.find(x => x.id === qid);
  if (!q) return false;
  // Re-check right before acting -- someone else may have started a session on this chair in
  // the last few seconds since the list last refreshed.
  if (sessionRows.some(s => s.chairName === chairName)) {
    alert(`${chairName} isn't free anymore \u2014 pick another available unit.`);
    return false;
  }
  const confirmMsg = `Start ${q.label || "this token"}${q.customerName ? " \u2014 " + q.customerName : ""} (${q.packageLabel || ""}) on ${chairName}?`;
  if (!confirm(confirmMsg)) return false;

  try {
    if (!q.sessionId) { alert("This token has no linked record \u2014 please start it from the main dashboard instead."); return false; }
    const sessionRef = fsDb.collection("sessions").doc(String(q.sessionId));
    const sessionSnap = await sessionRef.get();
    if (!sessionSnap.exists) { alert("Couldn't find this booking's record \u2014 please start it from the main dashboard instead."); return false; }
    await sessionRef.update({ chairName, status: "running", startTs: Date.now(), endTs: null });
    await fsDb.collection("waitingQueue").doc(String(qid)).delete();
    return true;
  } catch (e) {
    alert("Couldn't start this session: " + e.message);
    return false;
  }
}

function renderChairs(){
  const el = document.getElementById("chairList");
  if (!el) return;
  // Chairs currently running are the only ones we need to flag as busy here -- everything not
  // in that list is free. Keeps this page from needing the full chair-configuration logic the
  // main dashboard has.
  const busyNames = new Set(sessionRows.map(s => s.chairName));
  if (!busyNames.size) { el.innerHTML = `<div class="empty-note">Live status will appear here once chairs are in use.</div>`; return; }
  const rows = [...busyNames].sort().map(name => `
    <div class="chair-row"><span><span class="dot dot-busy"></span>${escapeHtml(name)}</span><span>Running</span></div>
  `).join("");
  el.innerHTML = rows || `<div class="empty-note">All units free.</div>`;
}

/* ============================== BOOK TAB ============================== */

function pad2(n){ return n < 10 ? "0"+n : ""+n; }
function todayStr(d = new Date()){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function timeStr(d = new Date()){ return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); }
function fmtMoney(n){ return "\u20B9" + Math.round(n).toLocaleString("en-IN"); }
function fmtMins(mins){
  if (mins < 60) return `${Math.round(mins)}m`;
  const h = Math.floor(mins/60), m = Math.round(mins%60);
  return m ? `${h}h ${m}m` : `${h}h`;
}
function nextLocalId(){
  let id = Date.now();
  if (id <= _lastLocalId) id = _lastLocalId + 1;
  _lastLocalId = id;
  return id;
}
function firstUnitOfType(type){
  return (liveConfig.chairOrder || []).find(c => unitTypeOf(c) === type);
}
function unitColorClass(unitType){
  if (unitType === "Leg") return "leg";
  if (unitType === "Advanced Leg") return "advleg";
  if (unitType === "Chair") return "chair";
  return "other"; // any future unit type beyond the original three
}
function activeUnitTypes(){
  const disabled = liveConfig.disabledUnits || [];
  return [...new Set((liveConfig.chairOrder || []).filter(c => !disabled.includes(c)).map(unitTypeOf))];
}
function tokenTypeLabel(unitType){
  if (unitType === "Leg") return "Foot";
  if (unitType === "Advanced Leg") return "Adv. Foot";
  if (unitType === "Chair") return "Body";
  return unitType; // any future unit type -- use its own name rather than defaulting to "Body"
}
// Same representative-pricing approach as the main dashboard's queueQuickOptions(): each unit
// type shares one pricing structure, so pull it from the first unit of that type.
function bookingOptionsFor(unitType){
  const ref = firstUnitOfType(unitType);
  const pkgs = (ref && liveConfig.packages[ref]) || [];
  return pkgs.map(p => ({ unitType, packageLabel: p.label, durationMin: p.min, price: p.price }))
    .sort((a,b) => a.durationMin - b.durationMin);
}
// A rough, mobile-friendly estimate -- deliberately simpler than the main dashboard's pause-aware
// calculation (this page doesn't track pauses at all); good enough for "about how long" at a glance.
function estimatedWaitSlots(unitType){
  const disabled = liveConfig.disabledUnits || [];
  const unitsOfType = (liveConfig.chairOrder || []).filter(c => !disabled.includes(c) && unitTypeOf(c) === unitType);
  if (!unitsOfType.length) return null;
  const now = Date.now();
  let freeAt = unitsOfType.map(c => {
    const running = sessionRows.find(s => s.chairName === c);
    if (running) return (running.startTs || now) + (running.durationMin || 0) * 60000;
    return now;
  });
  const queued = queueRows.filter(q => q.unitType === unitType);
  queued.forEach(q => {
    let minIdx = 0;
    for (let i = 1; i < freeAt.length; i++) if (freeAt[i] < freeAt[minIdx]) minIdx = i;
    freeAt[minIdx] = Math.max(freeAt[minIdx], now) + (q.durationMin || 0) * 60000;
  });
  // Same +3 min real-world buffer used on the main dashboard and on printed tokens (walking to
  // the chair, settling in) -- keeps this page's estimates consistent with what actually prints.
  const WAIT_ESTIMATE_BUFFER_MS = 3 * 60000;
  return freeAt.slice().sort((a,b) => a - b).map(t => t + WAIT_ESTIMATE_BUFFER_MS);
}

function renderBookTab(){
  const el = document.getElementById("bookContent");
  if (!el) return;
  const types = activeUnitTypes();
  const labelFor = (t) => t === "Advanced Leg" ? "Adv. Leg" : t;
  const ordinal = ["1st", "2nd", "3rd"];
  const waitRows = types.map(type => {
    const slots = estimatedWaitSlots(type);
    if (!slots) return "";
    return slots.slice(0, 3).map((slotTs, i) => {
      const waitMin = Math.max(0, Math.round((slotTs - Date.now()) / 60000));
      const label = waitMin <= 0
        ? `<span style="color:#7ee08c;">Free now</span>`
        : `~${waitMin}m (${new Date(slotTs).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})})`;
      return `<div class="wait-row"><span>${escapeHtml(labelFor(type))}${slots.length > 1 ? ` \u2014 ${ordinal[i]}` : ""}</span><span>${label}</span></div>`;
    }).join("");
  }).join("");

  const rowFor = (unitType) => {
    const opts = bookingOptionsFor(unitType);
    if (!opts.length) return "";
    return `<div class="unit-group">
      <div class="unit-group-label ${unitColorClass(unitType)}">${escapeHtml(labelFor(unitType))}</div>
      <div class="pkg-row">${opts.map((o,i) => `
        <button class="pkg-btn ${unitColorClass(unitType)}" data-unit="${escapeHtml(unitType)}" data-idx="${i}">+ ${escapeHtml(o.packageLabel)} ${fmtMoney(o.price)}</button>`).join("")}
      </div>
    </div>`;
  };

  const cartHtml = cart.length ? cart.map((c,i) => `
    <div class="cart-line"><span>${escapeHtml(c.unitType)} ${escapeHtml(c.packageLabel)} \u2014 ${fmtMoney(c.price)}</span><button data-remove="${i}">Remove</button></div>
  `).join("") : `<div class="empty-note">No items added yet.</div>`;

  const total = cart.reduce((a,c) => a + c.price, 0);
  const methods = (liveConfig.paymentMethods || []).filter(m => m.enabled);

  el.innerHTML = `
    <div class="section-title">Estimated Wait Time</div>
    ${waitRows || `<div class="empty-note">No units configured yet.</div>`}
    <div class="section-title">Booking</div>
    ${types.map(rowFor).join("")}
    <p class="assign-note">Works whether or not a unit is free right now \u2014 it becomes a token in the Waiting Queue, assign it from the Assign tab once ready.</p>
    <div class="section-title">Current Order</div>
    <div class="field"><label>Customer name (optional)</label><input id="bookCustomerName" value="${escapeHtml(cartCustomerName)}"></div>
    <div class="field"><label>Mobile number (optional)</label><input id="bookCustomerPhone" inputmode="numeric" value="${escapeHtml(cartCustomerPhone)}"></div>
    ${cartHtml}
    <div class="cart-line" style="font-weight:700; border-bottom:none;"><span>Total</span><span>${fmtMoney(total)}</span></div>
    <div class="pay-row">${methods.map(m => `<button class="pay-btn ${m.id === cartPayment ? "selected" : ""}" data-method="${escapeHtml(m.id)}">${escapeHtml(m.label)}</button>`).join("")}</div>
    <button class="btn" id="bookCheckoutBtn" ${cart.length ? "" : "disabled"}>Checkout</button>
  `;

  document.getElementById("bookCustomerName").addEventListener("input", e => { cartCustomerName = e.target.value; });
  document.getElementById("bookCustomerPhone").addEventListener("input", e => { cartCustomerPhone = e.target.value; });
  el.querySelectorAll(".pkg-btn").forEach(b => b.addEventListener("click", () => {
    const opt = bookingOptionsFor(b.dataset.unit)[parseInt(b.dataset.idx, 10)];
    cart.push(opt);
    renderBookTab();
  }));
  el.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => {
    cart.splice(parseInt(b.dataset.remove, 10), 1);
    renderBookTab();
  }));
  el.querySelectorAll(".pay-btn").forEach(b => b.addEventListener("click", () => { cartPayment = b.dataset.method; renderBookTab(); }));
  document.getElementById("bookCheckoutBtn").addEventListener("click", checkoutMobile);
}

// Ported from the main dashboard's checkoutCart(), same atomic guarantee: reserving the invoice
// number and saving the sale happen as ONE indivisible transaction. If anything interrupts it --
// a crash, the connection dying mid-flight -- Firestore guarantees NONE of it takes effect, not
// even the counter advancing. Falls back to a local-safe path if genuinely offline, same as the
// main dashboard, so booking still works through an outage.
async function checkoutMobile(){
  if (checkoutInFlight || !cart.length) return;
  checkoutInFlight = true;
  const btn = document.getElementById("bookCheckoutBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Processing\u2026"; }
  const now = new Date();
  const cartSnapshot = cart.slice();
  const method = cartPayment;
  const custName = cartCustomerName || null, custPhone = cartCustomerPhone || null;

  try {
    const itemPlans = cartSnapshot.map(item => ({
      item, sessionId: nextLocalId(), queueId: nextLocalId() + Math.floor(Math.random()*1000)
    }));

    const d = new Date();
    const yearLabel = "FY" + String(d.getFullYear()).slice(-2);
    const mm = pad2(d.getMonth()+1), dd = pad2(d.getDate());
    const dayKey = `${yearLabel}-${mm}-${dd}`;
    const invoicePrefixToday = `${liveConfig.invoicePrefix}-${dayKey}-`;
    const counterRef = fsDb.collection("meta").doc("invoiceCounters");

    // Self-heal floor: a live in-memory cache of every session isn't available on this lighter
    // page, so this asks Firestore directly for today's real invoice numbers instead -- same
    // principle as the main dashboard's highestInvoiceSeqUsedToday(), just fetched fresh here
    // rather than kept resident in memory.
    async function selfHealFloor(){
      try {
        const snap = await fsDb.collection("sessions").where("date", "==", todayStr(now)).get();
        let max = 0;
        snap.forEach(doc => {
          const inv = doc.data().invoiceNo;
          if (inv && inv.startsWith(invoicePrefixToday)) {
            const seq = parseInt(inv.slice(invoicePrefixToday.length), 10);
            if (!isNaN(seq) && seq > max) max = seq;
          }
        });
        return max;
      } catch (e) { return 0; }
    }

    const buildRecordsFor = (plan, thisInvoiceNo) => {
      const { item, sessionId, queueId } = plan;
      const session = {
        invoiceNo: thisInvoiceNo, date: todayStr(now), time: timeStr(now),
        chairName: null, unitType: item.unitType, packageLabel: item.packageLabel, durationMin: item.durationMin,
        amount: item.price, method, staff: currentUser.staffId, status: "queued",
        startTs: null, endTs: null, gst: { enabled: liveConfig.gstEnabled, rate: liveConfig.gstRate, gstin: liveConfig.gstin },
        paymentStatus: "paid", pendingGroupId: null,
        customerPhone: custPhone, customerName: custName,
        tokenNum: null, queuedAt: now.getTime()
      };
      const queueEntry = {
        id: queueId, unitType: item.unitType, packageLabel: item.packageLabel,
        durationMin: item.durationMin, price: item.price, label: `${tokenTypeLabel(item.unitType)} Token`,
        addedAt: now.getTime(), paid: true, method, invoiceNo: thisInvoiceNo,
        gst: { enabled: liveConfig.gstEnabled, rate: liveConfig.gstRate, gstin: liveConfig.gstin },
        customerName: custName, customerPhone: custPhone, sessionId
      };
      return { session, queueEntry };
    };

    const commitAtomically = async () => {
      const floor = await selfHealFloor();
      return await fsDb.runTransaction(async (tx) => {
        const snap = await tx.get(counterRef);
        const data = snap.exists ? snap.data() : {};
        const seq = Math.max(data[dayKey] || 0, floor) + 1;
        const thisInvoiceNo = `${liveConfig.invoicePrefix}-${yearLabel}-${mm}-${dd}-${String(seq).padStart(3,"0")}`;
        tx.set(counterRef, { [dayKey]: seq }, { merge: true });
        for (const plan of itemPlans) {
          const { session, queueEntry } = buildRecordsFor(plan, thisInvoiceNo);
          tx.set(fsDb.collection("sessions").doc(String(plan.sessionId)), session);
          tx.set(fsDb.collection("waitingQueue").doc(String(plan.queueId)), queueEntry);
        }
        return thisInvoiceNo;
      });
    };

    let invoiceNo, raceSettled = false;
    try {
      const attempt = commitAtomically();
      attempt.then((lateInvoiceNo) => {
        if (raceSettled) console.warn(`IMPORTANT: the original booking transaction succeeded AFTER the timeout already triggered the offline fallback, creating invoice ${lateInvoiceNo} -- this sale may now be recorded TWICE. Check Receipts and use Fix a Duplicate Invoice Number if so.`);
      }, () => {});
      invoiceNo = await Promise.race([
        attempt,
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 20000))
      ]);
      raceSettled = true;
    } catch (e) {
      raceSettled = true;
      console.warn("Booking transaction failed/timed out -- using offline-safe fallback:", e.message);
      const floor = await selfHealFloor();
      const seq = floor + 1; // best-effort local continuation -- no CONFIG.invoiceCounters cache on this lighter page
      invoiceNo = `${liveConfig.invoicePrefix}-${yearLabel}-${mm}-${dd}-${String(seq).padStart(3,"0")}`;
      for (const plan of itemPlans) {
        const { session, queueEntry } = buildRecordsFor(plan, invoiceNo);
        fsDb.collection("sessions").doc(String(plan.sessionId)).set(session).catch(err => console.warn("session save failed:", err.message));
        fsDb.collection("waitingQueue").doc(String(plan.queueId)).set(queueEntry).catch(err => console.warn("queue save failed:", err.message));
      }
    }

    alert(`Booked \u2014 Invoice ${invoiceNo}. Assign it to a chair from the Assign tab once ready.`);
    cart = [];
    cartCustomerName = ""; cartCustomerPhone = "";
    cartPayment = liveConfig.defaultPaymentMethod || "UPI";
    renderBookTab();
  } catch (e) {
    alert("Something went wrong: " + e.message + "\n\nCheck Receipts on the main dashboard before trying again, to avoid booking twice.");
  } finally {
    checkoutInFlight = false;
    if (btn) { btn.disabled = false; btn.textContent = "Checkout"; }
  }
}

window.addEventListener("DOMContentLoaded", async () => {
  const unsub = fbAuth.onAuthStateChanged(async (user) => {
    unsub();
    if (!user) { buildLogin(); return; }
    try {
      const token = await user.getIdTokenResult(true);
      if (token.claims.active !== true || !token.claims.role) { await fbAuth.signOut(); buildLogin(); return; }
      if (token.claims.role === "mall_admin") { await fbAuth.signOut(); buildLogin("This page is for staff use only. Please use the Mall Admin Portal instead."); return; }
      currentUser = { uid: user.uid, role: token.claims.role, staffId: user.email.split("@")[0] };
      buildApp();
    } catch (e) { await fbAuth.signOut(); buildLogin(); }
  });
});
</script>
