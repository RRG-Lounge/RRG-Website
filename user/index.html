<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRG Lounge — Mall Admin Portal</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine: #16332C;
    --pine-2: #1F4A40;
    --pine-3: #0E211C;
    --cream: #F1E9D8;
    --cream-2: #E7DCC3;
    --copper: #C1703A;
    --copper-light: #DE9863;
    --ink: #16332C;
    --line: rgba(22,51,44,0.14);
    --max: min(96vw, 1800px);
  }
  * { box-sizing: border-box; }
  /* Fluid base size: this whole dashboard is read-only, viewed at everything from a phone to a
     large monitor, so text scales smoothly with viewport width instead of sitting at one fixed
     size -- ~15px on a small phone up to ~19px on a large desktop. Every size below is in rem,
     so it scales together with this.
     iOS Safari separately auto-boosts rendered text size on top of whatever CSS computes, but
     doesn't apply that same boost to images -- on a fluid rem+clamp() layout like this one, that
     mismatch is exactly what causes text to render far bigger than the layout was sized for while
     logos stay put, producing the overlap. text-size-adjust:100% turns that auto-boost off so
     what's rendered actually matches what was laid out. */
  html { font-size: clamp(15px, 0.55vw + 13.3px, 19px); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  #root { max-width: var(--max); margin: 0 auto; min-height: 100vh; }
  .topbar, .tabs, .content { max-width: var(--max); margin-left: auto; margin-right: auto; }
  @media (min-width: 900px) {
    /* Operations tab's four summary panels sit side-by-side on wider screens; Receipts' one
       wide table panel is left alone -- it already uses the extra width itself. */
    #mainContent.op-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; align-items: start; }
    #mainContent.op-grid .panel { margin-bottom: 0; }
  }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px; box-shadow: 0 4px 24px rgba(22,51,44,0.08); }
  .login-brand { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.5rem; color: var(--pine); text-align: center; margin-bottom: 4px; }
  .login-sub { text-align: center; color: var(--pine-2); opacity: 0.75; font-size: 0.9rem; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.9rem; color: var(--pine-2); margin-bottom: 4px; }
  .field input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--cream); color: var(--ink); font-size: 1.1rem; font-family: 'Inter', sans-serif; }
  .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--copper); color: #fff; font-weight: 600; font-size: 1.1rem; cursor: pointer; font-family: 'Inter', sans-serif; }
  .btn:disabled { opacity: 0.5; }
  .login-error { color: #b3432f; font-size: 0.9rem; margin-top: 10px; text-align: center; min-height: 16px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 8px; gap: 12px; flex-wrap: wrap; }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .topbar img.brand-logo { height: 2.4rem; width: auto; display: none; } /* shown via JS once a file is found */
  .topbar-titles { min-width: 0; }
  .topbar-titles .mall-name { font-family: 'Fraunces', serif; font-weight: 600; color: var(--pine); font-size: 1.4rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-titles .portal-label { color: var(--copper); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .topbar-user { text-align: right; }
  .topbar-user .user-name { color: var(--pine-2); font-size: 1rem; }
  .topbar button { background: transparent; border: 1px solid var(--line); color: var(--pine); padding: 8px 16px; border-radius: 6px; font-family: 'Inter', sans-serif; cursor: pointer; font-size: 0.95rem; }
  .mall-picker { background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 0.9rem; margin-top: 2px; font-family: 'Inter', sans-serif; }
  .content { padding: 8px 20px 40px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 16px; }
  .panel-title { font-family: 'Fraunces', serif; font-size: 1.35rem; font-weight: 600; color: var(--pine); margin-bottom: 6px; }
  .panel-help { font-size: 0.9rem; color: var(--pine-2); opacity: 0.75; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 1.05rem; }
  td, th { padding: 9px 6px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--pine-2); opacity: 0.7; font-size: 0.85rem; text-transform: uppercase; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 7px; }
  .dot-red { background: #b3432f; } .dot-amber { background: var(--copper-light); } .dot-green { background: #4a7a5e; }
  .tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .tab { padding: 10px 16px; color: var(--pine-2); opacity: 0.6; cursor: pointer; font-size: 1.05rem; border-bottom: 2px solid transparent; font-weight: 500; }
  .tab.active { color: var(--copper); opacity: 1; border-bottom-color: var(--copper); font-weight: 600; }
  .btn-small { padding: 7px 12px; font-size: 0.9rem; width: auto; display: inline-block; }
  .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--pine); }
  .btn-outline.qr-active { background: var(--copper); color: #fff; border-color: var(--copper); font-weight: 600; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-primary { background: var(--copper); color: #fff; border: none; }
  .btn-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
  .filter-field { display: flex; flex-direction: column; font-size: 0.85rem; color: var(--pine-2); opacity: 0.85; }
  .filter-field input, .filter-field select { margin-top: 3px; padding: 8px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--cream); color: var(--ink); font-size: 0.95rem; font-family: 'Inter', sans-serif; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .data-table td, .data-table th { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  .data-table th { color: var(--pine-2); opacity: 0.7; font-size: 0.8rem; text-transform: uppercase; }
  .receipt-actions { white-space: nowrap; }
  .receipt-actions .btn-small { margin-right: 4px; margin-bottom: 4px; }
  .table-scroll { overflow-x: auto; }
  .pkg-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .pkg-btn { padding: 10px 14px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.95rem; color: #fff; cursor: pointer; }
  .pkg-btn.unit-chair { background: var(--pine); } .pkg-btn.unit-leg { background: #2f6690; } .pkg-btn.unit-advleg { background: #7a4fa0; } .pkg-btn.unit-other { background: var(--copper); }
  .unit-group { margin-bottom: 18px; }
  .unit-group-label { font-weight: 700; margin-bottom: 8px; font-family: 'Fraunces', serif; }
  .unit-group-label.unit-chair { color: var(--pine); } .unit-group-label.unit-leg { color: #2f6690; } .unit-group-label.unit-advleg { color: #7a4fa0; } .unit-group-label.unit-other { color: var(--copper); }
  .cart-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
  .cart-line button { background: transparent; border: none; color: #b3432f; font-size: 0.85rem; cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

// This is a deliberately minimal, self-contained, READ-ONLY page -- built as its own file rather
// than reusing the full dashboard specifically so its source can safely sit in a public repo if
// needed (e.g. embedded into the relaxrechargego.com website): it contains no checkout, pricing,
// or write logic at all, nothing beyond what a Mall Admin is already meant to see. The actual
// security boundary is real Firebase Auth + Firestore Rules (server-side, role-checked) -- NOT
// keeping this file's source hidden. Critically: nothing on this page loads or renders until a
// real login (Staff ID + PIN) succeeds AND the account's role is verified to be mall_admin --
// unlike the older dashboard file, there is no bootstrap/auto-sign-in of any kind here.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA6BnYGNx3hKNcSxHgN9Wpyz6LkB_MUKq4",
  authDomain: "rrg-lounge-os.firebaseapp.com",
  projectId: "rrg-lounge-os",
  storageBucket: "rrg-lounge-os.firebasestorage.app",
  messagingSenderId: "1071966836969",
  appId: "1:1071966836969:web:e433f87d2d05748e573878"
};
firebase.initializeApp(FIREBASE_CONFIG);
const fbAuth = firebase.auth();
const fsDb = firebase.firestore();

const CASH_DENOMS = [500, 200, 100, 50, 20, 10, 5, 2, 1];
let liveConfig = { chairOrder: [], disabledUnits: [], unitTypes: {}, staff: [], businessName: "RRG Lounge", mdSharePercent: 30, gstEnabled: false, gstRate: 18, mdName: "", packages: {}, paymentMethods: [], defaultPaymentMethod: "UPI", invoicePrefix: "RRG", gstin: "", mobileBookingEnabled: false, timesUpAlertRules: [], adminPhoneTools: {} };
let sessionsToday = [], paymentSplitsToday = [], adjustmentsToday = [], queueRows = [];
let unsubs = [];
let currentTab = "operations";

// ---------------------------------------------------------------------------
// Self-service branding -- same pattern as the main relaxrechargego.com site's
// Locations system: nothing here is hardcoded. Add/swap a mall by editing
// /malls.json (one entry: {id, name}) and dropping image files named
// <id>-mall-logo.<ext> into /assets/ -- no code changes, no redeploy of logic.
// Our own logo reuses the SAME file the main site already uses (/assets/rrg-logo.<ext>),
// so updating it once updates it everywhere.
// ---------------------------------------------------------------------------
const IMG_EXTS = ["png", "jpg", "jpeg", "webp"];
let mallsList = [];       // loaded from /malls.json
let selectedMallId = null; // which mall's branding is currently shown

function tryLoadImage(imgEl, basePath, extIndex){
  extIndex = extIndex || 0;
  if (extIndex >= IMG_EXTS.length) { imgEl.style.display = "none"; return; }
  imgEl.onerror = () => tryLoadImage(imgEl, basePath, extIndex + 1);
  imgEl.onload = () => {
    imgEl.style.display = "inline-block";
    // Record which extension actually loaded, so anything reusing this image later (e.g. adding
    // it to a PDF) knows its real format instead of assuming PNG -- passing the wrong format to
    // jsPDF's addImage decodes the bytes incorrectly and corrupts the image visually.
    imgEl.dataset.imgFormat = IMG_EXTS[extIndex] === "jpg" ? "JPEG" : IMG_EXTS[extIndex].toUpperCase();
  };
  imgEl.src = basePath + "." + IMG_EXTS[extIndex];
}

async function loadMallsList(){
  try {
    const res = await fetch("/malls.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("no malls.json");
    mallsList = await res.json();
  } catch (e) {
    mallsList = []; // fine -- branding just falls back to generic labels below
  }
}

// ---------------------------------------------------------------------------
// Self-service visibility settings -- same file-in-repo pattern as malls.json. Edit
// /mall-admin-visibility.json directly on GitHub (true/false per section) to show or hide a
// tab or panel for Mall Admin -- no code change needed. Missing keys default to visible (true),
// so an incomplete or missing config file never silently hides something unintended.
// ---------------------------------------------------------------------------
let visibilityConfig = {};
async function loadVisibilityConfig(){
  try {
    const res = await fetch("/mall-admin-visibility.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("no visibility config");
    visibilityConfig = await res.json();
  } catch (e) {
    visibilityConfig = {}; // fine -- isVisible() defaults everything to true below
  }
}
// Reads a dotted path like "operations.paymentMethodBreakdown" out of visibilityConfig.
// Anything not explicitly set to false is treated as visible.
function isVisible(path){
  const parts = path.split(".");
  let node = visibilityConfig;
  for (const p of parts) {
    if (node == null || typeof node !== "object") return true;
    node = node[p];
  }
  return node !== false;
}

function currentMall(){
  if (!mallsList.length) return null;
  return mallsList.find(m => m.id === selectedMallId) || mallsList[0];
}

function renderBranding(){
  const rrgLogoImg = document.getElementById("rrgLogoImg");
  if (rrgLogoImg) tryLoadImage(rrgLogoImg, "/assets/rrg-logo");

  const mall = currentMall();
  const mallLogoImg = document.getElementById("mallLogoImg");
  const mallNameEl = document.getElementById("mallNameLabel");
  if (mall) {
    if (mallLogoImg) tryLoadImage(mallLogoImg, "/assets/" + mall.id + "-mall-logo");
    if (mallNameEl) mallNameEl.textContent = mall.name;
  } else {
    if (mallLogoImg) mallLogoImg.style.display = "none";
    if (mallNameEl) mallNameEl.textContent = "RRG Lounge";
  }

  // Picker only ever appears once more than one mall is actually configured in
  // malls.json. NOTE: this currently only switches which mall's NAME/LOGO is shown --
  // real per-mall data separation is a separate backend project, not yet built.
  const pickerWrap = document.getElementById("mallPickerWrap");
  if (pickerWrap) pickerWrap.style.display = mallsList.length > 1 ? "block" : "none";
}

function currentStaffName(){
  const email = fbAuth.currentUser && fbAuth.currentUser.email;
  const staffId = email ? email.split("@")[0] : "";
  const rec = (liveConfig.staff || []).find(s => s.staffId === staffId);
  return (rec && rec.name) ? rec.name : staffId;
}

// Generic "show it's working" wrapper for any button whose click kicks off something that isn't
// instant (PDF/Excel generation, opening a print window) -- disables the button and swaps its
// label to "Processing..." for the duration, restores it after, even if the work throws.
async function withBusyButton(btn, fn){
  if (!btn) { await fn(); return; }
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Processing\u2026";
  // The heavy work below (jsPDF/SheetJS) runs synchronously and blocks the main thread --
  // without this, the browser batches the label change together with that work and never
  // actually paints "Processing..." until it's already done. Waiting two animation frames
  // guarantees a real paint happens first.
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  try {
    await fn();
  } catch (e) {
    alert("Something went wrong: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

// Highlights whichever quick-range button (Today/Yesterday/This Month, Last 1 Month, etc.) was
// just clicked, clearing the highlight from its siblings -- so it's visible which range is
// currently selected, the same way the top tabs show which tab is active.
function markActiveQuickRange(clickedBtn){
  if (!clickedBtn || !clickedBtn.parentElement) return;
  clickedBtn.parentElement.querySelectorAll(".qr-btn").forEach(b => b.classList.remove("qr-active"));
  clickedBtn.classList.add("qr-active");
}

function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function fmtMoney(n){ return "\u20B9" + Math.round(n||0).toLocaleString("en-IN"); }
function todayStr(d){ d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function fmtMMSS(totalSec){ const s = Math.max(0, totalSec); const m = Math.floor(s/60); const r = s%60; return String(m).padStart(2,"0") + ":" + String(r).padStart(2,"0"); }
function unitTypeOf(name){ if (liveConfig.unitTypes && liveConfig.unitTypes[name]) return liveConfig.unitTypes[name]; return name.startsWith("Leg") ? "Leg" : "Chair"; }
function activeChairOrder(){ const disabled = liveConfig.disabledUnits || []; return (liveConfig.chairOrder || []).filter(c => !disabled.includes(c)); }

function sessionEffectiveEndTs(s){
  const base = s.startTs + s.durationMin * 60000 + (s.pausedTotalMs || 0);
  return s.pauseStartedAt ? (base + (Date.now() - s.pauseStartedAt)) : base;
}
function getRunningSession(chairName){
  const rows = sessionsToday.filter(s => s.chairName === chairName && s.status === "running");
  if (!rows.length) return null;
  return rows.reduce((latest, s) => sessionEffectiveEndTs(s) > sessionEffectiveEndTs(latest) ? s : latest);
}
function chairAwaitingAcknowledgment(chairName){
  return sessionsToday.some(s => s.chairName === chairName && s.needsAcknowledgment);
}
function latestUnacknowledgedForChair(chairName){
  const rows = sessionsToday.filter(s => s.chairName === chairName && s.needsAcknowledgment);
  if (!rows.length) return null;
  return rows.reduce((a,b) => (a.endTs > b.endTs ? a : b));
}
function matchesTimesUpAlertRule(unitType, durationMin){
  return (liveConfig.timesUpAlertRules || []).some(r => r.enabled && r.unitType === unitType && r.durationMin === durationMin);
}
// Lets staff on mobile mark an overdue chair clear themselves, when the desk dashboard isn't open
// to catch it (its own auto-complete timer only runs while that tab is open). Writes the exact
// same fields the dashboard itself would -- status, endTs -- so there's nothing left inconsistent
// whenever the dashboard does next load. Deliberately sets needsAcknowledgment to false outright
// rather than true-then-clear: a staff member deliberately tapping this on their own phone IS the
// human confirmation the dashboard's own alert is designed to collect, so there's no reason to
// leave it pending (and no surprise alarm later) -- it was already handled, from here.
// Three independent chair-management actions -- all usable regardless of whether mobile
// Booking is turned on, and gated only by role (never for mall_admin). All three write directly
// to the SAME session record the desk dashboard itself reads/writes, so nothing is ever left
// inconsistent between the two.
function canManageChairs(){ return currentUserRole !== "mall_admin"; }

// Clear Timer -- works on ANY running chair, not just an overdue one (staff may need to end a
// session early), and doubles as "Acknowledge" for a chair already flagged Time's Up (both are
// the same underlying action: a human confirming this chair is done/physically clear).
async function clearSessionTimer(sessionId){
  const s = sessionsToday.find(x => x.id === sessionId);
  if (!s) return;
  const natural = sessionEffectiveEndTs(s);
  const now = Date.now();
  const endingEarly = s.status === "running" && natural > now;
  const msg = endingEarly
    ? `${s.chairName}'s timer hasn't finished yet (${fmtMMSS(Math.round((natural-now)/1000))} remaining) \u2014 end the session now anyway?`
    : `Clear ${s.chairName}'s timer and make it available again?`;
  if (!confirm(msg)) return;
  try {
    await fsDb.collection("sessions").doc(String(sessionId)).update({
      status: "completed",
      endTs: endingEarly ? now : natural,
      needsAcknowledgment: false
    });
  } catch (e) {
    alert("Couldn't clear this chair: " + e.message);
  }
}

// Move -- the TOKEN/customer is correct, just started on the wrong physical chair. Only the
// chair changes; the original start time stays untouched, so remaining time is unaffected.
async function moveSessionToChair(sessionId, newChair){
  const s = sessionsToday.find(x => x.id === sessionId);
  if (!s) return;
  if (sessionsToday.some(x => x.status === "running" && x.chairName === newChair)) {
    alert(`${newChair} isn't free anymore \u2014 pick another available unit.`);
    return;
  }
  if (!confirm(`Move this session from ${s.chairName} to ${newChair}?`)) return;
  try {
    await fsDb.collection("sessions").doc(String(sessionId)).update({ chairName: newChair, unitType: unitTypeOf(newChair) });
  } catch (e) {
    alert("Couldn't move this session: " + e.message);
  }
}

// Send Back to Queue -- the WRONG token was started here entirely. Undoes the assignment:
// reverts the session to its pre-start shape (same fields startFromQueue originally set, just
// reversed) and recreates its waiting-queue entry from the session's own stored fields, with the
// SAME sessionId so a later correct "Start on Chair" updates this same record, not a duplicate.
async function sendSessionBackToQueue(sessionId){
  const s = sessionsToday.find(x => x.id === sessionId);
  if (!s) return;
  if (!confirm(`Send this token back to the Waiting Queue? This undoes its chair assignment \u2014 use this only if the wrong token was started here.`)) return;
  try {
    const sessionRef = fsDb.collection("sessions").doc(String(sessionId));
    const newQueueId = nextLocalId();
    const batch = fsDb.batch();
    batch.update(sessionRef, { chairName: null, status: "queued", startTs: null, endTs: null, needsAcknowledgment: false });
    batch.set(fsDb.collection("waitingQueue").doc(String(newQueueId)), {
      id: newQueueId,
      unitType: s.unitType,
      packageLabel: s.packageLabel,
      durationMin: s.durationMin,
      price: s.amount,
      label: `${tokenTypeLabel(s.unitType)} Token`,
      addedAt: s.queuedAt || Date.now(),
      paid: s.paymentStatus === "paid",
      method: s.method,
      invoiceNo: s.invoiceNo || null,
      gst: s.gst || { enabled: false, rate: 18, gstin: "" },
      customerName: s.customerName || null,
      customerPhone: s.customerPhone || null,
      sessionId: sessionId
    });
    await batch.commit();
  } catch (e) {
    alert("Couldn't send this back to the queue: " + e.message);
  }
}

// Shared row-actions builder used by both Operations' Live Chair Status and Queue's Chair Status,
// so the two never drift out of sync with each other.
function chairActionsHtml(chairName, session, isAwaitingAck){
  if (!canManageChairs()) return "";
  const clearBtn = `<button class="btn-outline btn-small chair-action-clear" data-session="${session.id}">Clear Timer</button>`;
  if (isAwaitingAck) return clearBtn;
  const freeOthers = freeMatchingChairs(unitTypeOf(chairName)).filter(c => c !== chairName);
  const moveHtml = freeOthers.length ? `
    <select class="chair-action-move" data-session="${session.id}" data-chair="${escapeHtml(chairName)}" style="padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:var(--cream); color:var(--ink); font-family:'Inter',sans-serif; font-size:0.85rem;">
      <option value="">Move to\u2026</option>
      ${freeOthers.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("")}
    </select>` : "";
  const sendBackBtn = `<button class="btn-outline btn-small chair-action-sendback" data-session="${session.id}">Send Back to Queue</button>`;
  return `<div style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;">${clearBtn}${moveHtml}${sendBackBtn}</div>`;
}

// Same mid-interaction guard already used for Queue's "Start on a chair" select -- a live update
// landing while a native dropdown is open would otherwise swap the DOM out from under an open
// picker. Wiring every chair-action dropdown/button through this one helper keeps that guarantee
// everywhere these controls appear, not just in the one spot it was first built for.
function wireChairActionControls(el){
  el.querySelectorAll(".chair-action-clear").forEach(b => b.addEventListener("click", (e) => withBusyButton(e.target, async () => {
    await clearSessionTimer(parseInt(b.dataset.session, 10));
  })));
  el.querySelectorAll(".chair-action-sendback").forEach(b => b.addEventListener("click", (e) => withBusyButton(e.target, async () => {
    await sendSessionBackToQueue(parseInt(b.dataset.session, 10));
  })));
  el.querySelectorAll(".chair-action-move").forEach(sel => {
    sel.addEventListener("focus", () => {
      queueInteractionActive = true;
      clearTimeout(queueInteractionSafetyTimer);
      queueInteractionSafetyTimer = setTimeout(() => {
        queueInteractionActive = false;
        if (queueRerenderPending) { queueRerenderPending = false; render(); }
      }, 8000);
    });
    sel.addEventListener("blur", () => {
      clearTimeout(queueInteractionSafetyTimer);
      queueInteractionActive = false;
      if (queueRerenderPending) { queueRerenderPending = false; render(); }
    });
    sel.addEventListener("change", async () => {
      const sessionId = parseInt(sel.dataset.session, 10);
      const newChair = sel.value;
      if (!newChair) return;
      await moveSessionToChair(sessionId, newChair);
      sel.value = "";
    });
  });
}
function isChairInCart(){ return false; } // this page has no cart/checkout at all -- never true here
function adjustmentFor(invoiceNo){ return adjustmentsToday.find(a => a.invoiceNo === invoiceNo) || null; }
function paymentSplitFor(invoiceNo){ return paymentSplitsToday.find(p => p.invoiceNo === invoiceNo) || null; }
function collectedAmount(s){
  if (s.status === "cancelled") return (s.refunded || s.paymentStatus === "pending") ? 0 : s.amount;
  return s.paymentStatus === "paid" ? s.amount : 0;
}
function effectiveRevenue(s){
  if (s.status === "cancelled") return (s.refunded || s.paymentStatus === "pending") ? 0 : s.amount;
  return s.amount;
}
function adjustmentsTotalForSessions(sessions){
  const seen = new Set(); let total = 0;
  sessions.forEach(s => {
    if (s.invoiceNo && !seen.has(s.invoiceNo)) {
      seen.add(s.invoiceNo);
      const adj = adjustmentFor(s.invoiceNo);
      if (adj) total += adj.amount;
    }
  });
  return total;
}
// Normalizes any payment-method string (from a session, a split row, or an adjustment) to one
// of the three canonical buckets -- defends against a stray case/whitespace difference (e.g.
// "cash" vs "Cash") silently creating an invisible extra bucket that never shows on screen.
// Anything that genuinely isn't Cash/UPI/Card falls into "Other", which the table below DOES
// render if it's ever non-zero, rather than swallowing the amount without a trace.
function normalizePaymentMethod(m){
  const t = String(m || "").trim();
  const lower = t.toLowerCase();
  if (lower === "cash") return "Cash";
  if (lower === "upi") return "UPI";
  if (lower === "card") return "Card";
  return t || "Other";
}
function paymentMethodTotals(){
  const totals = { Cash: { amount: 0, count: 0 }, UPI: { amount: 0, count: 0 }, Card: { amount: 0, count: 0 } };

  // Group sessions by invoice first -- a single checkout can cover multiple chairs/items under
  // one invoiceNo, and every one of those line items has to be summed together before bucketing
  // by payment method. Treating each session row on its own (the earlier approach here) silently
  // dropped every line item after the first on any multi-item bill.
  const invoiceMap = {};
  const standalone = [];
  for (const s of sessionsToday) {
    if (s.invoiceNo) {
      if (!invoiceMap[s.invoiceNo]) invoiceMap[s.invoiceNo] = { method: s.method, sessions: [] };
      invoiceMap[s.invoiceNo].sessions.push(s);
    } else {
      standalone.push(s);
    }
  }
  const addTo = (methodRaw, amount, addCount) => {
    const key = normalizePaymentMethod(methodRaw);
    if (!totals[key]) totals[key] = { amount: 0, count: 0 };
    totals[key].amount += amount;
    if (addCount) totals[key].count += 1;
  };

  Object.keys(invoiceMap).forEach(invoiceNo => {
    const { method, sessions } = invoiceMap[invoiceNo];
    const collected = sessions.reduce((a, s) => a + collectedAmount(s), 0);
    // An adjustment corrects THIS invoice's own bill -- fold it into the same method bucket the
    // sale itself falls into, matching how the Receipts tab (and the real dashboard) attribute it.
    const adj = adjustmentFor(invoiceNo);
    const adjAmt = adj ? adj.amount : 0;
    if (collected <= 0 && adjAmt === 0) return;

    if (normalizePaymentMethod(method) === "Split") {
      const split = paymentSplitFor(invoiceNo);
      if (split) {
        split.splits.forEach(row => addTo(row.method, row.amount, true));
        // Best-effort: an adjustment on a split-paid invoice goes into the split's first
        // component bucket -- there's no single "right" bucket for a correction on a bill that
        // was itself paid across multiple methods.
        if (adjAmt && split.splits.length) addTo(split.splits[0].method, adjAmt, false);
      }
      return;
    }
    addTo(method, collected + adjAmt, true); // one count per INVOICE, not per line item
  });

  standalone.forEach(s => {
    const collected = collectedAmount(s);
    if (collected <= 0) return;
    addTo(s.method, collected, true);
  });

  return totals;
}

let currentUserRole = null;

async function doLogin(){
  const staffId = document.getElementById("loginId").value.trim();
  const pin = document.getElementById("loginPin").value;
  if (!staffId || !pin) { buildLogin("Enter your Staff ID and PIN."); return; }
  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  try {
    const cred = await fbAuth.signInWithEmailAndPassword(`${staffId}@rrglounge.local`, pin);
    const token = await cred.user.getIdTokenResult(true);
    if (token.claims.active !== true) { await fbAuth.signOut(); buildLogin("This account has been disabled."); return; }
    if (!token.claims.role) { await fbAuth.signOut(); buildLogin("Account isn't fully set up yet. Please see Admin."); return; }
    currentUserRole = token.claims.role;
    await buildApp();
  } catch (e) {
    let msg = "Couldn't sign in. Please try again.";
    if (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential" || e.code === "auth/invalid-login-credentials") msg = "Incorrect PIN.";
    else if (e.code === "auth/user-not-found") msg = "Staff ID not found.";
    else if (e.code === "auth/network-request-failed") msg = "No internet connection.";
    buildLogin(msg);
  }
}

// Which tabs exist at all depends on WHO logged in -- mall_admin gets the read-only reporting
// suite (further narrowed by mall-admin-visibility.json); staff gets just the queue tool they
// need at the chair, plus Book if that's turned on; anyone else (you, or any other internal
// role) gets the queue tool plus Operations/Receipts, so either the desk or a phone can be the
// one assigning chairs or taking a booking.
function computeVisibleTabs(){
  let allTabs;
  if (currentUserRole === "mall_admin") {
    allTabs = [
      { id: "operations", label: "Operations" },
      { id: "receipts", label: "Receipts" },
      { id: "mdshare", label: "Mall Share" },
      { id: "analytics", label: "Analytics" }
    ];
  } else if (currentUserRole === "staff") {
    allTabs = [ { id: "queue", label: "Queue" } ];
    if (liveConfig.mobileBookingEnabled) allTabs.push({ id: "book", label: "Book" });
  } else {
    allTabs = [ { id: "queue", label: "Queue" } ];
    if (liveConfig.mobileBookingEnabled) allTabs.push({ id: "book", label: "Book" });
    allTabs.push({ id: "operations", label: "Operations" }, { id: "receipts", label: "Receipts" });
    // Admin-only tools, each switched on from the dashboard's Settings ("Admin tools on the phone page")
    const apt = liveConfig.adminPhoneTools || {};
    if (currentUserRole === "admin" && (apt.dailySummary || apt.revenueShare)) allTabs.push({ id: "mdshare", label: "Mall Share" });
    if (currentUserRole === "admin" && apt.cashRegister) allTabs.push({ id: "cash", label: "Cash" });
    if (currentUserRole === "admin" && apt.analytics) allTabs.push({ id: "analytics", label: "Analytics" });
    allTabs.push({ id: "settings", label: "Settings" });
  }
  // The visibility JSON only ever applies to the mall_admin experience -- it's what YOU use to
  // control what Mall Admin sees; it was never meant to also gate your own or staff's tools.
  const visibleTabs = currentUserRole === "mall_admin" ? allTabs.filter(t => isVisible(t.id + ".enabled")) : allTabs;
  return { allTabs, visibleTabs };
}

// Rebuilds just the tab bar (and fixes up currentTab if it just got hidden) -- called both at
// initial login and again whenever meta/config changes live, since mobileBookingEnabled can be
// flipped at any time and should show/hide the Book tab immediately, on every phone, no reload.
function refreshTabBar(){
  const tabsEl = document.getElementById("tabsBar");
  if (!tabsEl) return; // buildApp() hasn't run yet -- nothing to refresh
  const { allTabs, visibleTabs } = computeVisibleTabs();
  if (!visibleTabs.some(t => t.id === currentTab)) currentTab = (visibleTabs[0] || allTabs[0]).id;
  tabsEl.innerHTML = visibleTabs.map(t => `<div class="tab${t.id === currentTab ? " active" : ""}" data-tab="${t.id}">${t.label}</div>`).join("");
  tabsEl.querySelectorAll(".tab").forEach(tabEl => {
    tabEl.addEventListener("click", () => {
      currentTab = tabEl.dataset.tab;
      tabsEl.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tabEl));
      // Analytics/Mall Share load their full session history once and cache it (a live listener
      // for "all-time" data would be needlessly expensive) -- so the longer the page stays open
      // without switching away, the more that snapshot drifts from Operations' always-live
      // figures. Forcing a fresh reload on every switch INTO either tab keeps them honest without
      // re-fetching on every unrelated update while just sitting on the tab.
      if (currentTab === "analytics" || currentTab === "mdshare") mallShareLoaded = false;
      render();
    });
  });
}

    .where("invoiceNo", ">=", "RRG-FY").where("invoiceNo", "<", "RRG-FZ"); // narrows to this year's invoices; filtered further client-side by date below

  unsubs.push(fsDb.collection("meta").doc("config").onSnapshot(doc => {
    const config = (doc.data() || {}).value || {}; // stored as {key:"config", value:{...}}, not flat
    liveConfig = { chairOrder: config.chairOrder || [], disabledUnits: config.disabledUnits || [], unitTypes: config.unitTypes || {}, staff: config.staff || [], businessName: config.businessName || "RRG Lounge", mdSharePercent: (typeof config.mdSharePercent === "number") ? config.mdSharePercent : 30, gstEnabled: !!config.gstEnabled, gstRate: config.gstRate || 18, mdName: config.mdName || "", packages: config.packages || {}, paymentMethods: config.paymentMethods || [], defaultPaymentMethod: config.defaultPaymentMethod || "UPI", invoicePrefix: config.invoicePrefix || "RRG", gstin: config.gstin || "", mobileBookingEnabled: !!config.mobileBookingEnabled, timesUpAlertRules: config.timesUpAlertRules || [], adminPhoneTools: config.adminPhoneTools || {} };
    const nameEl = document.getElementById("userNameLabel");

  unsubs.push(fsDb.collection("sessions").where("date", "==", today).onSnapshot(snap => {
    sessionsToday = snap.docs.map(d => Object.assign({}, d.data(), { id: parseInt(d.id, 10) }));

  // paymentSplits/invoiceAdjustments aren't dated directly -- keyed by invoiceNo, which embeds

  // full-collection read.
  const invPrefix = `RRG-FY${today.slice(2,4)}-${today.slice(5,7)}-${today.slice(8,10)}`;
  unsubs.push(fsDb.collection("paymentSplits").where("invoiceNo", ">=", invPrefix).where("invoiceNo", "<", invPrefix + "\uf8ff").onSnapshot(snap => {
    paymentSplitsToday = snap.docs.map(d => d.data());

  }));
  unsubs.push(fsDb.collection("invoiceAdjustments").where("invoiceNo", ">=", invPrefix).where("invoiceNo", "<", invPrefix + "\uf8ff").onSnapshot(snap => {
    adjustmentsToday = snap.docs.map(d => d.data());

  if (currentUserRole !== "mall_admin") {

      lastQueueSyncTs = Date.now();

    }));
    // A stalled connection would otherwise leave the "Synced Xs ago" label frozen at whatever it
    // said when things stopped updating -- ticking it forward independently of Firestore activity
    // is what actually makes staleness visible rather than silently trusting old data on screen.
    unsubs.push(() => clearInterval(queueStaleTicker));
    queueStaleTicker = setInterval(() => { if (currentTab === "queue") render(); else renderTimesUpTray(); }, 5000);
  }
}

// On a busy day, several Firestore updates can land within the same second (a chair status
// change, someone else marking a token called, etc.) -- each one calling render() separately
// means several full panel rebuilds back-to-back, which is exactly what a "lag"/flicker feeling
// on a real phone comes from. Coalescing them into one render a beat later fixes that without
// changing what gets shown -- direct user actions (switching tabs) still render immediately.
let renderDebounceTimer = null;
function requestRender(){
  if (renderDebounceTimer) return;
  renderDebounceTimer = setTimeout(() => { renderDebounceTimer = null; render(); }, 120);
}

// Persistent alert, visible above the tabs on EVERY screen (not tied to any one tab), same
// principle as the desk dashboard's own Time's Up tray -- a unit finishing while staff are on a
// different tab still gets seen immediately, not just whenever they happen to open Operations or
// Queue. Always on regardless of mobileBookingEnabled; never shown to mall_admin.
function renderTimesUpTray(){
  const trayEl = document.getElementById("timesUpTray");
  if (!trayEl) return; // buildApp() hasn't run yet
  if (!canManageChairs()) { trayEl.innerHTML = ""; return; }
  const overdue = sessionsToday.filter(s => s.needsAcknowledgment).sort((a,b) => a.endTs - b.endTs);
  if (!overdue.length) { trayEl.innerHTML = ""; return; }
  trayEl.innerHTML = `
    <div style="background:#FBECE5; border-bottom:2px solid var(--copper); padding:8px 20px;">
      ${overdue.map(s => {
        const overdueSec = Math.max(0, Math.round((Date.now() - s.endTs) / 1000));
        return `<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:4px 0; flex-wrap:wrap;">
          <span>\u23f0 <b>${escapeHtml(s.chairName)}</b> \u2014 Time's Up (${fmtMMSS(overdueSec)} ago)</span>
          <button class="btn-outline btn-small chair-action-clear" data-session="${s.id}">Acknowledge</button>
        </div>`;
      }).join("")}
    </div>`;
  wireChairActionControls(trayEl);
}

function renderOperationsTab(){
  const el = document.getElementById("mainContent");
  if (!el) return;
  el.classList.add("op-grid");
  const today = todayStr();

  const rows = activeChairOrder().map(chairName => {
    const running = getRunningSession(chairName);
    if (running) {
      const remainSec = Math.max(0, Math.round((sessionEffectiveEndTs(running) - Date.now())/1000));
      const paused = !!running.pauseStartedAt;
      return `<tr><td>${escapeHtml(chairName)}</td><td><span class="dot dot-red"></span>Running${paused ? " (Paused)" : ""}</td><td>${running.durationMin}m</td><td>${fmtMMSS(remainSec)}</td><td>${chairActionsHtml(chairName, running, false)}</td></tr>`;
    }
    if (chairAwaitingAcknowledgment(chairName)) {
      const s = latestUnacknowledgedForChair(chairName);
      const overdueSec = Math.max(0, Math.round((Date.now() - s.endTs) / 1000));
      return `<tr><td>${escapeHtml(chairName)}</td><td><span class="dot dot-red"></span>\u23f0 Time's Up (${fmtMMSS(overdueSec)} ago)</td><td>${s.durationMin}m</td><td>-</td><td>${chairActionsHtml(chairName, s, true)}</td></tr>`;
    }
    return `<tr><td>${escapeHtml(chairName)}</td><td><span class="dot dot-green"></span>Available</td><td>-</td><td>-</td><td></td></tr>`;
  }).join("");

  const completed = sessionsToday.filter(s => s.status === "completed").length;
  const runningCount = sessionsToday.filter(s => s.status === "running").length;
  const revenue = sessionsToday.reduce((a,s) => a + effectiveRevenue(s), 0) + adjustmentsTotalForSessions(sessionsToday);
  const methodTotals = paymentMethodTotals();
  // Render every bucket that actually exists (Cash/UPI/Card always shown even at zero; anything
  // unexpected -- e.g. a mismatched method string on an adjustment -- shows as its own row instead
  // of silently vanishing). Total is summed across ALL buckets, so it can never drift from Revenue.
  const knownOrder = ["Cash", "UPI", "Card"];
  const extraKeys = Object.keys(methodTotals).filter(k => !knownOrder.includes(k)).sort();
  const methodRowOrder = knownOrder.concat(extraKeys);
  const methodRows = methodRowOrder.map(k => `<tr><td>${escapeHtml(k)}</td><td>${methodTotals[k].count}</td><td>${fmtMoney(methodTotals[k].amount)}</td></tr>`).join("");
  const grandCount = methodRowOrder.reduce((a,k) => a + methodTotals[k].count, 0);
  const grandAmount = methodRowOrder.reduce((a,k) => a + methodTotals[k].amount, 0);

  const paymentPanelHtml = isVisible("operations.paymentMethodBreakdown") ? `
    <div class="panel">
      <div class="panel-title">Payment Method Breakdown \u2014 Today</div>
      <table>
        <thead><tr><th>Method</th><th>Transactions</th><th>Amount</th></tr></thead>
        <tbody>
          ${methodRows}
          <tr><td><b>Total Collected</b></td><td><b>${grandCount}</b></td><td><b>${fmtMoney(grandAmount)}</b></td></tr>
        </tbody>
      </table>
    </div>` : "";

  el.innerHTML = `
    <div class="panel">
      <div class="panel-title">Live Chair Status</div>
      <div class="table-scroll"><table><thead><tr><th>Unit</th><th>Status</th><th>Package</th><th>Remaining</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
    <div class="panel">
      <div class="panel-title">Today's Summary</div>
      <table>
        <tr><td>Customers Today</td><td>${sessionsToday.length}</td></tr>
        <tr><td>Running Sessions</td><td>${runningCount}</td></tr>
        <tr><td>Completed Sessions</td><td>${completed}</td></tr>
        <tr><td><b>Today's Revenue</b></td><td><b>${fmtMoney(revenue)}</b></td></tr>
      </table>
    </div>
    ${paymentPanelHtml}
  `;

  wireChairActionControls(el);
}

}
function massagerNameFor(unitType){ return tokenTypeLabel(unitType) + " Massager"; }
function cartItemName(chairName, packageLabel, unitTypeFallback){
  const type = chairName != null ? unitTypeOf(chairName) : (unitTypeFallback || "Chair");
  return massagerNameFor(type) + "-" + packageLabel;
}
function tokenItemDisplayName(item){
  if (item.chairName != null) return cartItemName(item.chairName, item.packageLabel);
  return massagerNameFor(item.unitType) + "-" + item.packageLabel;
}
function groupCartItemsClean(items){
  const map = {}; const order = [];
  items.forEach(it => {
    const name = tokenItemDisplayName(it);
    const key = name + "|" + it.price;
    if (!map[key]) { map[key] = { name, rate: it.price, qty: 0, subtotal: 0 }; order.push(key); }
    map[key].qty += 1;
    map[key].subtotal += it.price;
  });
  return order.map(k => map[k]);
}
function splitMethodLabel(split){
  if (!split) return "Split";
  return split.splits.filter(s => s.amount > 0).map(s => `${s.method} ${fmtMoney(s.amount)}`).join(" + ");
}
function dmy(d = new Date()){
  const pad2 = n => String(n).padStart(2,"0");
  return pad2(d.getDate()) + "/" + pad2(d.getMonth()+1) + "/" + d.getFullYear();
}
function timeStr(d = new Date()){
  const pad2 = n => String(n).padStart(2,"0");
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
}
function fmtMoneyPDF(n){ return "Rs." + Math.round(n||0).toLocaleString("en-IN"); }
function pdfSafeText(v){
  if (v === null || v === undefined) return v;
  if (typeof v !== "string") return v;
  return v
    .replace(/\u2192/g, "->").replace(/\u2190/g, "<-")
    .replace(/[\u2013\u2014]/g, "-").replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201c\u201d]/g, '"').replace(/\u2026/g, "...")
    .replace(/[^\x00-\x7F]/g, "");
}
function gstBreakup(amount, rate){
  const taxable = amount / (1 + rate/100);
  const totalTax = amount - taxable;
  return { taxable, cgst: totalTax/2, sgst: totalTax/2 };
}

// ---- Receipts data (loaded on demand, NOT a permanent listener -- avoids an ever-growing
// full-history read cost; only the currently selected filter's range is ever fetched) ----
let receiptsSessions = [], receiptsSplits = [], receiptsAdjustments = [], receiptsTxnRefs = [];
let receiptsLoadedRange = null; // {from, to} of what's currently loaded, so we don't re-fetch needlessly
let receiptsFilterFrom = null, receiptsFilterTo = null, receiptsSearchInvoice = "";
let receiptsFilterYear = "", receiptsFilterMonth = "", receiptsFilterPaymentType = "";

function invNoPrefix(dateStr){ return `RRG-FY${dateStr.slice(2,4)}-${dateStr.slice(5,7)}-${dateStr.slice(8,10)}`; }

// Invoice numbers embed the date (RRG-FYyy-mm-dd-seq) and sort lexicographically WITHIN a
// calendar year -- this range fetch is reliable for any range inside one calendar year (the
// common case: Today, a month, a custom recent range). A range crossing a Dec->Jan boundary
// can miss rows because "mm" resets past "dd" ordering -- flagged here rather than silently
// risking a wrong/incomplete receipts list; ask before relying on this for a Dec-Jan range.
async function loadReceiptsRange(from, to){
  const fromPrefix = invNoPrefix(from), toPrefix = invNoPrefix(to);
  const [sessSnap, splitSnap, adjSnap, refSnap] = await Promise.all([
    fsDb.collection("sessions").where("date", ">=", from).where("date", "<=", to).get(),
    fsDb.collection("paymentSplits").where("invoiceNo", ">=", fromPrefix).where("invoiceNo", "<", toPrefix + "\uf8ff").get(),
    fsDb.collection("invoiceAdjustments").where("invoiceNo", ">=", fromPrefix).where("invoiceNo", "<", toPrefix + "\uf8ff").get(),
    fsDb.collection("txnRefs").where("invoiceNo", ">=", fromPrefix).where("invoiceNo", "<", toPrefix + "\uf8ff").get()
  ]);
  receiptsSessions = sessSnap.docs.map(d => Object.assign({}, d.data(), { id: parseInt(d.id, 10) }));
  receiptsSplits = splitSnap.docs.map(d => d.data());
  receiptsAdjustments = adjSnap.docs.map(d => d.data());
  receiptsTxnRefs = refSnap.docs.map(d => d.data());
  receiptsLoadedRange = { from, to };
}

function receiptAdjustmentFor(invoiceNo){ return receiptsAdjustments.find(a => a.invoiceNo === invoiceNo) || null; }
function receiptSplitFor(invoiceNo){ return receiptsSplits.find(p => p.invoiceNo === invoiceNo) || null; }
function receiptTxnRefFor(invoiceNo){ const r = receiptsTxnRefs.find(x => x.invoiceNo === invoiceNo); return r ? r.ref : ""; }

function sessionItemLabel(s){
  const base = `${cartItemName(s.chairName, s.packageLabel, s.unitType)} (${s.chairName || "unassigned"})`;
  if (s.status === "cancelled") return `${base} [${s.refunded ? "Cancelled-Refunded" : "Cancelled-Kept"}]`;
  return base;
}
function invoicesFromSessions(){
  const map = {}; const order = [];
  for (const s of receiptsSessions) {
    if (!s.invoiceNo) continue;
    if (!map[s.invoiceNo]) {
      const checkoutTs = new Date(s.date + "T" + s.time).getTime() || Date.now();
      map[s.invoiceNo] = { invoiceNo: s.invoiceNo, date: s.date, time: s.time, startTs: checkoutTs, staff: s.staff, method: s.method, gst: s.gst, customerName: s.customerName || null, sessions: [] };
      order.push(s.invoiceNo);
    }
    map[s.invoiceNo].sessions.push(s);
  }
  return order.map(k => map[k]).sort((a,b) => b.startTs - a.startTs);
}
function invoiceToSaleObject(inv){
  const activeSessions = inv.sessions.filter(s => s.status !== "cancelled");
  const cancelledSessions = inv.sessions.filter(s => s.status === "cancelled");
  const priced = activeSessions.map(s => ({ chairName: s.chairName, packageLabel: s.packageLabel, price: s.amount, unitType: s.unitType }));
  const items = groupCartItemsClean(priced);
  cancelledSessions.forEach(s => {
    const tag = s.refunded ? "Cancelled - Refunded" : "Cancelled - Kept";
    items.push({ name: `${tokenItemDisplayName(s)} (${tag})`, rate: s.refunded ? 0 : s.amount, qty: 1, subtotal: s.refunded ? 0 : s.amount });
  });
  const baseTotal = inv.sessions.reduce((a,s) => a + effectiveRevenue(s), 0);
  const adj = receiptAdjustmentFor(inv.invoiceNo);
  if (adj) items.push({ name: adj.label, rate: adj.amount, qty: 1, subtotal: adj.amount });
  const total = baseTotal + (adj ? adj.amount : 0);
  const split = inv.method === "Split" ? receiptSplitFor(inv.invoiceNo) : null;
  return { invoiceNo: inv.invoiceNo, date: inv.date, time: inv.time, startTs: inv.startTs, staff: inv.staff, method: inv.method, methodDisplay: split ? splitMethodLabel(split) : inv.method, gst: inv.gst, items, total, customerName: inv.customerName || null };
}
function currentFilteredInvoices(){
  return invoicesFromSessions().filter(inv => {
    if (receiptsFilterYear !== "" || receiptsFilterMonth !== "") {
      if (receiptsFilterYear !== "" && inv.date.slice(0,4) !== String(receiptsFilterYear)) return false;
      if (receiptsFilterMonth !== "" && (parseInt(inv.date.slice(5,7),10) - 1) !== parseInt(receiptsFilterMonth,10)) return false;
    } else {
      if (inv.date < receiptsFilterFrom || inv.date > receiptsFilterTo) return false;
    }
    if (receiptsSearchInvoice) {
      const q = receiptsSearchInvoice.toLowerCase();
      const matchesInvoice = inv.invoiceNo.toLowerCase().includes(q);
      const matchesCustomer = inv.customerName && inv.customerName.toLowerCase().includes(q);
      const matchesTxnRef = receiptTxnRefFor(inv.invoiceNo).toLowerCase().includes(q);
      if (!matchesInvoice && !matchesCustomer && !matchesTxnRef) return false;
    }
    if (receiptsFilterPaymentType && inv.method !== receiptsFilterPaymentType) return false;
    return true;
  });
}
function receiptsFilterLabel(){
  const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const parts = [];
  if (receiptsFilterMonth !== "") parts.push(MONTH_ABBR[parseInt(receiptsFilterMonth,10)]);
  if (receiptsFilterYear !== "") parts.push(receiptsFilterYear);
  if (parts.length) return parts.join("_");
  return `${receiptsFilterFrom}_to_${receiptsFilterTo}`;
}

function exportReceiptPDFSimple(sale){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ compress: true, unit: "mm", format: "a5" });
  const rightX = 138; let y = 14;
  doc.setFont("courier","bold"); doc.setFontSize(13);
  doc.text(pdfSafeText(liveConfig.businessName || "RRG Lounge"), 74, y, { align: "center" }); y += 8;
  doc.setLineWidth(0.2); doc.line(10, y, rightX, y); y += 6;
  doc.setFont("courier","normal"); doc.setFontSize(10);
  [["Invoice No", sale.invoiceNo||"-"], ["Date", dmy(new Date(sale.startTs)) + " " + sale.time], ["Staff", sale.staff||""], ["Customer", sale.customerName||""]].forEach(r => {
    doc.text(r[0], 10, y); doc.text(pdfSafeText(String(r[1])), rightX, y, { align: "right" }); y += 6;
  });
  doc.line(10, y, rightX, y); y += 6;
  sale.items.forEach(it => { doc.text(pdfSafeText(`${it.name} x${it.qty}`), 10, y); doc.text(fmtMoneyPDF(it.subtotal), rightX, y, { align: "right" }); y += 6; });
  doc.line(10, y, rightX, y); y += 6;
  const gst = sale.gst || { enabled:false, rate:18, gstin:"" };
  if (gst.enabled) {

    [["Taxable Value", fmtMoneyPDF(b.taxable)], [`CGST @ ${(gst.rate/2).toFixed(1)}%`, fmtMoneyPDF(b.cgst)], [`SGST @ ${(gst.rate/2).toFixed(1)}%`, fmtMoneyPDF(b.sgst)]].forEach(r => {
      doc.text(r[0], 10, y); doc.text(r[1], rightX, y, { align: "right" }); y += 6;

  doc.save(`${(sale.invoiceNo || "Receipt").replace(/[^\w-]/g,"_")}.pdf`);
}

function exportReceiptsExcel(){
  const invoices = currentFilteredInvoices();
  if (!invoices.length) { alert("No receipts match the current filter."); return; }
  const rows = invoices.map(inv => {
    const baseTotal = inv.sessions.reduce((a,s) => a + effectiveRevenue(s), 0);
    const adj = receiptAdjustmentFor(inv.invoiceNo);
    const total = baseTotal + (adj ? adj.amount : 0);
    const split = inv.method === "Split" ? receiptSplitFor(inv.invoiceNo) : null;
    return {
      Invoice: inv.invoiceNo, Date: inv.date, Time: inv.time,
      Customer: inv.customerName || "", "Txn Ref": receiptTxnRefFor(inv.invoiceNo) || "",
      Items: inv.sessions.map(sessionItemLabel).join(", "), Total: total,
      Payment: split ? splitMethodLabel(split) : inv.method, Staff: inv.staff
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Receipts");
  XLSX.writeFile(wb, `Receipts_${receiptsFilterLabel()}.xlsx`);
}

      return [pdfSafeText(inv.invoiceNo), inv.date, inv.time, pdfSafeText(inv.customerName||"-"), pdfSafeText(receiptTxnRefFor(inv.invoiceNo)||"-"), pdfSafeText(inv.sessions.map(sessionItemLabel).join(", ")), fmtMoneyPDF(total), pdfSafeText(split ? splitMethodLabel(split) : inv.method), pdfSafeText(inv.staff)];

async function refetchAndRenderReceipts(){
  // Year/Month filter searches across that whole span; a plain From/To searches just that range.
  const from = (receiptsFilterYear || receiptsFilterMonth)
    ? `${receiptsFilterYear || "2020"}-${receiptsFilterMonth !== "" ? String(parseInt(receiptsFilterMonth,10)+1).padStart(2,"0") : "01"}-01`
    : receiptsFilterFrom;
  const to = (receiptsFilterYear || receiptsFilterMonth)
    ? `${receiptsFilterYear || "2035"}-${receiptsFilterMonth !== "" ? String(parseInt(receiptsFilterMonth,10)+1).padStart(2,"0") : "12"}-31`
    : receiptsFilterTo;
  const tableEl = document.getElementById("rTable");
  if (tableEl) tableEl.innerHTML = `<tbody><tr><td>Loading\u2026</td></tr></tbody>`;
  try {
    await loadReceiptsRange(from, to);
  } catch (e) {
    if (tableEl) tableEl.innerHTML = `<tbody><tr><td>Couldn't load receipts: ${escapeHtml(e.message)}</td></tr></tbody>`;
    return;
  }
  renderReceiptsTable();
}

/* ========================= MALL SHARE TAB (view/export only) =========================
   Same read-only scope already proven for role "mall_admin" in the main dashboard: Overview,
   Daily Performance Summary, Revenue Share Report, Settlement Report. No Log a Settlement, no
   Settlement History -- those stay internal to RRG Lounge's own dashboard.
   Simplified from the source dashboard in one deliberate way: the cash-reconciliation
   "recorded vs actual (bank-matched) vs variance" system is NOT ported here, because the real
   money figures (Revenue/GST/Mall Share/Owner Share) are computed from RECORDED amounts either
   way -- reconciliation only ever affected a variance column, never the actual owed amount. */

function dmyShort(dateStr){
  const [y,m,d] = dateStr.split("-");
  return `${d}-${m}-${y.slice(2)}`;
}

let mallShareSessions = [], mallShareAdjustments = [], mallShareSplits = [], mallShareSettlements = [];
let mallShareLoaded = false;

async function loadMallShareData(){
  const [sessSnap, adjSnap, splitSnap, settleSnap] = await Promise.all([
    fsDb.collection("sessions").get(),
    fsDb.collection("invoiceAdjustments").get(),
    fsDb.collection("paymentSplits").get(),
    fsDb.collection("shareSettlements").get()
  ]);
  mallShareSessions = sessSnap.docs.map(d => Object.assign({}, d.data(), { id: parseInt(d.id, 10) }));
  mallShareAdjustments = adjSnap.docs.map(d => d.data());
  mallShareSplits = splitSnap.docs.map(d => d.data());
  mallShareSettlements = settleSnap.docs.map(d => d.data());
  mallShareLoaded = true;
}
function msAdjustmentFor(invoiceNo){ return mallShareAdjustments.find(a => a.invoiceNo === invoiceNo) || null; }
function msSplitFor(invoiceNo){ return mallShareSplits.find(p => p.invoiceNo === invoiceNo) || null; }

function computeMdSummary(from, to){
  const rows = mallShareSessions.filter(s => s.date >= from && s.date <= to);
  const unitsUsed = new Set(rows.map(s => s.chairName).filter(Boolean)).size;
  let totalRevenue = rows.reduce((a,s) => a + effectiveRevenue(s), 0);

  const pkgAgg = {}; const pkgOrder = [];
  rows.forEach(s => {
    const key = cartItemName(s.chairName, s.packageLabel, s.unitType);
    if (!pkgAgg[key]) { pkgAgg[key] = { count: 0, revenue: 0 }; pkgOrder.push(key); }
    pkgAgg[key].count++;
    pkgAgg[key].revenue += effectiveRevenue(s);
  });

  const payAgg = { UPI: 0, Cash: 0, Card: 0, Pending: 0 };
  const seenSplitInvoices = new Set();
  rows.forEach(s => {
    const rev = effectiveRevenue(s);
    if (rev <= 0) return;
    if (s.method === "Split") {
      if (!s.invoiceNo || seenSplitInvoices.has(s.invoiceNo)) return;
      seenSplitInvoices.add(s.invoiceNo);
      const split = msSplitFor(s.invoiceNo);
      if (split) split.splits.forEach(row => { payAgg[row.method] = (payAgg[row.method] || 0) + row.amount; });
      return;
    }
    if (!(s.method in payAgg)) payAgg[s.method] = 0;
    payAgg[s.method] += rev;
  });

  let adjustmentsNet = 0;
  const seenAdjInvoices = new Set();
  rows.forEach(s => {
    if (!s.invoiceNo || seenAdjInvoices.has(s.invoiceNo)) return;
    const adj = msAdjustmentFor(s.invoiceNo);
    if (!adj) return;
    seenAdjInvoices.add(s.invoiceNo);
    totalRevenue += adj.amount;
    adjustmentsNet += adj.amount; // kept OUT of pkgAgg on purpose: an adjustment's own note must never appear as a package
    payAgg[adj.method] = (payAgg[adj.method] || 0) + adj.amount;
  });

  const mdSharePercent = liveConfig.mdSharePercent;
  const mdShare = totalRevenue * (mdSharePercent / 100);
  const ownerShare = totalRevenue - mdShare;
  return { totalSessions: rows.length, unitsUsed, totalRevenue, pkgAgg, pkgOrder, adjustmentsNet, payAgg, mdSharePercent, mdShare, ownerShare };
}

// Same money math the dashboard uses -- recorded amounts, not a bank-reconciled "actual" figure
// (see file header note above for why that's correct, not a simplification of the real number).
function paymentMethodFinal(rec){
  const totalRecorded = ["UPI","Cash","Card","Pending"].reduce((a,m) => a + (rec.payAgg[m] || 0), 0);
  const gstRegistered = !!liveConfig.gstEnabled;
  const gstRate = liveConfig.gstRate || 0;
  const baseRevenue = gstRegistered ? totalRecorded / (1 + gstRate/100) : totalRecorded;
  const gstAmount = gstRegistered ? totalRecorded - baseRevenue : 0;
  const finalMdShare = baseRevenue * (rec.mdSharePercent / 100);
  const finalOwnerShare = baseRevenue - finalMdShare;
  return { finalTotalRevenue: totalRecorded, gstRegistered, gstRate, baseRevenue, gstAmount, finalMdShare, finalOwnerShare };
}
function buildAdhocRec(from, to){
  const s = computeMdSummary(from, to);
  return { periodFrom: from, periodTo: to, totalSessions: s.totalSessions, unitsUsed: s.unitsUsed, pkgOrder: s.pkgOrder, pkgAgg: s.pkgAgg, adjustmentsNet: s.adjustmentsNet, payAgg: s.payAgg, totalRevenue: s.totalRevenue, mdSharePercent: s.mdSharePercent, mdShareAmount: s.mdShare, ownerShareAmount: s.ownerShare };
}
function mallShareForRange(from, to){
  if (from > to) return 0;
  return paymentMethodFinal(buildAdhocRec(from, to)).finalMdShare;
}
function settledAmountForRange(from, to){
  let total = 0;
  for (const r of mallShareSettlements) {
    if (r.status !== "transferred") continue;
    const oFrom = r.periodFrom > from ? r.periodFrom : from;
    const oTo = r.periodTo < to ? r.periodTo : to;
    if (oFrom > oTo) continue;
    const fullOwedForSettlement = mallShareForRange(r.periodFrom, r.periodTo);
    const ratio = fullOwedForSettlement > 0 ? Math.min(1, (r.mdShareAmount || 0) / fullOwedForSettlement) : 0;
    total += mallShareForRange(oFrom, oTo) * ratio;
  }
  return total;
}
function unsettledAmountForRange(from, to){
  const raw = mallShareForRange(from, to) - settledAmountForRange(from, to);
  const rounded = Math.round(raw * 100) / 100;
  return rounded > 1 ? rounded : 0;
}
function isRangeFullySettled(from, to){ return unsettledAmountForRange(from, to) < 0.5; }
function latestCoveringSettlement(from, to){
  const covering = mallShareSettlements.filter(r => r.status === "transferred" && !(to < r.periodFrom || from > r.periodTo)).sort((a,b) => (b.transferDate||"").localeCompare(a.transferDate||""));
  return covering[0] || null;
}
function settlementsInBusinessPeriod(from, to){
  return mallShareSettlements.filter(r => r.status === "transferred" && !(r.periodTo < from || r.periodFrom > to)).sort((a,b) => (a.periodFrom||"").localeCompare(b.periodFrom||""));
}

// Adds our logo (left) and the mall's logo (right) to a jsPDF doc, reusing the SAME <img>
// elements already loaded in the top bar -- no separate base64 config needed.
// Re-encodes any loaded <img> (regardless of its original format -- webp, jpg, whatever) into a
// PNG data URL via canvas. jsPDF's addImage only understands PNG/JPEG natively; webp specifically
// isn't supported at all, so passing it straight through corrupts or silently drops the image.
// Going through canvas sidesteps the format question entirely -- the browser decodes the source
// image (webp decoding is a normal browser capability), and toDataURL always re-encodes as PNG.
function imageToPngDataUrl(imgEl){
  try {
    const canvas = document.createElement("canvas");
    canvas.width = imgEl.naturalWidth;
    canvas.height = imgEl.naturalHeight;
    canvas.getContext("2d").drawImage(imgEl, 0, 0);
    return canvas.toDataURL("image/png");
  } catch (e) { return null; }
}

function addPdfLogos(doc, y, pageWidth){
  const logoH = 13;
  const rrgImg = document.getElementById("rrgLogoImg");
  const mallImg = document.getElementById("mallLogoImg");
  let used = false;
  if (rrgImg && rrgImg.style.display !== "none" && rrgImg.naturalWidth) {
    const dataUrl = imageToPngDataUrl(rrgImg);
    if (dataUrl) {
      const w = logoH * (rrgImg.naturalWidth / rrgImg.naturalHeight);
      try { doc.addImage(dataUrl, "PNG", 14, y, w, logoH); used = true; } catch(e) {}
    }
  }
  if (mallImg && mallImg.style.display !== "none" && mallImg.naturalWidth) {
    const dataUrl = imageToPngDataUrl(mallImg);
    if (dataUrl) {
      const w = logoH * (mallImg.naturalWidth / mallImg.naturalHeight);
      try { doc.addImage(dataUrl, "PNG", pageWidth - 14 - w, y, w, logoH); used = true; } catch(e) {}
    }
  }
  return used ? y + logoH + 5 : y;
}

// Package-by-package rows for the exported statement (shown only when mdshare.packageBreakup is on in the
// visibility settings file). REAL packages only: an invoice adjustment's own note (typo fixes, duplicates,
// cancellations) is kept out of this list so it never shows up as if it were a package. Because adjustments
// are still inside Total Revenue, on a day that has one the package revenues add up to the total plus/minus
// that net adjustment (Sessions always add up). If you'd rather close that gap visibly, turn on
// mdshare.packageAdjustmentsLine to add ONE neutral "Other adjustments (net)" line -- never the individual notes.
function packageRowsForExport(rec){
  const rows = (rec.pkgOrder || []).map(k => ({ name: k, count: rec.pkgAgg[k].count, revenue: rec.pkgAgg[k].revenue }));
  const net = Math.round(rec.adjustmentsNet || 0);
  if (net !== 0 && isExplicitlyOn("mdshare.packageAdjustmentsLine")) rows.push({ name: "Other adjustments (net)", count: "", revenue: net });
  return rows;
}

/* ---------------------- Admin: Revenue Share Statement, same as the dashboard (Build 3, part 3) ----------------------
   Admin login only. The Mall Admin login keeps its own simpler statement above, unchanged.
   Everything below is the dashboard's own statement code, copied across with only these swaps:
   CONFIG -> admStmtCfg (read fresh from meta/config, so it carries the logos too), the dashboard's
   caches -> this page's Mall Share data (mallShareSessions / Adjustments / Splits / Settlements, which
   are the same Firestore collections) plus cashCounts, and doc.save -> the iPhone Share sheet.
   Mall Share owed / settled / status reuse this page's mallShareForRange etc.: those work off the
   RECORDED payment totals, exactly as the dashboard's do, so the figures are the same. */
let admStmtCfg = null, admCashCounts = [];
async function loadAdminStatementData(){
  const [cfgDoc, ccSnap] = await Promise.all([
    fsDb.collection("meta").doc("config").get(),
    fsDb.collection("cashCounts").get()
  ]);
  const v = (cfgDoc.data() || {}).value || {};
  admStmtCfg = {
    businessName: liveConfig.businessName, mdName: liveConfig.mdName,
    gstEnabled: liveConfig.gstEnabled, gstRate: liveConfig.gstRate,
    logoDataUrl: v.logoDataUrl || "", mdLogoDataUrl: v.mdLogoDataUrl || ""
  };
  admCashCounts = ccSnap.docs.map(d => Object.assign({}, d.data(), { id: parseInt(d.id, 10) }));
}

// Same as the dashboard's computeMdSummary: an invoice adjustment shows as its own labelled line
// in the Package table (the dashboard's statement does this; the Mall Admin version here doesn't).
function admComputeMdSummary(from, to){
  const rows = mallShareSessions.filter(s => s.date >= from && s.date <= to);
  const unitsUsed = new Set(rows.map(s => s.chairName).filter(Boolean)).size;
  let totalRevenue = rows.reduce((a,s) => a + effectiveRevenue(s), 0);
  const pkgAgg = {}; const pkgOrder = [];
  rows.forEach(s => {
    const key = cartItemName(s.chairName, s.packageLabel, s.unitType);
    if (!pkgAgg[key]) { pkgAgg[key] = { count: 0, revenue: 0 }; pkgOrder.push(key); }
    pkgAgg[key].count++;
    pkgAgg[key].revenue += effectiveRevenue(s);
  });
  const payAgg = { UPI: 0, Cash: 0, Card: 0, Pending: 0 };
  const seenSplitInvoices = new Set();
  rows.forEach(s => {
    const rev = effectiveRevenue(s);
    if (rev <= 0) return;
    if (s.method === "Split") {
      if (!s.invoiceNo || seenSplitInvoices.has(s.invoiceNo)) return;
      seenSplitInvoices.add(s.invoiceNo);
      const split = msSplitFor(s.invoiceNo);
      if (split) split.splits.forEach(row => { payAgg[row.method] = (payAgg[row.method] || 0) + row.amount; });
      return;
    }
    if (!(s.method in payAgg)) payAgg[s.method] = 0;
    payAgg[s.method] += rev;
  });
  const seenAdjInvoices = new Set();
  rows.forEach(s => {
    if (!s.invoiceNo || seenAdjInvoices.has(s.invoiceNo)) return;
    const adj = msAdjustmentFor(s.invoiceNo);
    if (!adj) return;
    seenAdjInvoices.add(s.invoiceNo);
    totalRevenue += adj.amount;
    if (!pkgAgg[adj.label]) { pkgAgg[adj.label] = { count: 0, revenue: 0 }; pkgOrder.push(adj.label); }
    pkgAgg[adj.label].count++;
    pkgAgg[adj.label].revenue += adj.amount;
    payAgg[adj.method] = (payAgg[adj.method] || 0) + adj.amount;
  });
  const mdSharePercent = liveConfig.mdSharePercent;
  const mdShare = totalRevenue * (mdSharePercent / 100);
  return { totalSessions: rows.length, unitsUsed, totalRevenue, pkgAgg, pkgOrder, payAgg, mdSharePercent, mdShare, ownerShare: totalRevenue - mdShare };
}

function admSurchargeOf(s){ return (s.cardSurcharge > 0 && !(s.status === "cancelled" && s.refunded)) ? s.cardSurcharge : 0; }
function admCardSurchargeForDate(dateStr){ return mallShareSessions.reduce((a, x) => x.date === dateStr ? a + admSurchargeOf(x) : a, 0); }
function admReconciliationStatusForDate(dateStr){
  const counts = admCashCounts.filter(c => c.date === dateStr);
  const opening = counts.find(c => c.type === "opening");
  const closing = counts.find(c => c.type === "closing");
  const upi = counts.find(c => c.type === "upiReceived");
  const card = counts.find(c => c.type === "cardReceived");
  return { date: dateStr, closingDone: !!closing, upiDone: !!upi, ok: !!closing && !!upi, opening, closing, upi, card };
}
// Dashboard's computeCashReconciliationForPeriod, unchanged apart from the data source.
function admComputeCashReconciliationForPeriod(from, to){
  const dates = [...new Set(mallShareSessions.filter(s => s.date >= from && s.date <= to).map(s => s.date))].sort();
  const statuses = dates.map(admReconciliationStatusForDate);
  const unreconciledDates = statuses.filter(s => !s.ok).map(s => s.date);
  const allReconciled = dates.length > 0 && unreconciledDates.length === 0;
  const openingDenomTotals = {}, denomTotals = {};
  CASH_DENOMS.forEach(d => { openingDenomTotals[d] = 0; denomTotals[d] = 0; });
  let openingTotal = 0, cashTotal = 0, cashVarianceTotal = 0, upiActualTotal = 0, upiVarianceTotal = 0;
  if (allReconciled) {
    statuses.forEach(s => {
      const openDenoms = (s.opening && s.opening.denominations) || {};
      const closeDenoms = (s.closing && s.closing.denominations) || {};
      CASH_DENOMS.forEach(d => {
        openingDenomTotals[d] += parseInt(openDenoms[d], 10) || 0;
        denomTotals[d] += parseInt(closeDenoms[d], 10) || 0;
      });
      openingTotal += (s.opening && s.opening.total) || 0;
      cashTotal += (s.closing && s.closing.total) || 0;
      cashVarianceTotal += (s.closing && s.closing.variance) || 0;
      upiActualTotal += (s.upi && s.upi.total) || 0;
      upiVarianceTotal += (s.upi && s.upi.variance) || 0;
    });
  }
  let cardActualTotal = 0, cardVarianceTotal = 0, cardDataAvailable = false;
  statuses.forEach(s => {
    if (s.card) { cardActualTotal += (s.card.total || 0) - admCardSurchargeForDate(s.date); cardVarianceTotal += s.card.variance || 0; cardDataAvailable = true; }
  });
  return { dates, unreconciledDates, allReconciled, openingDenomTotals, denomTotals, openingTotal, cashTotal, cashVarianceTotal, upiActualTotal, upiVarianceTotal, cardActualTotal, cardVarianceTotal, cardDataAvailable };
}
function admBuildAdhocRec(from, to){
  const s = admComputeMdSummary(from, to);
  const recon = admComputeCashReconciliationForPeriod(from, to);
  return {
    periodFrom: from, periodTo: to,
    totalSessions: s.totalSessions, unitsUsed: s.unitsUsed,
    pkgOrder: s.pkgOrder, pkgAgg: s.pkgAgg, payAgg: s.payAgg,
    totalRevenue: s.totalRevenue, mdSharePercent: s.mdSharePercent,
    mdShareAmount: s.mdShare, ownerShareAmount: s.ownerShare,
    cashRecon: { allReconciled: recon.allReconciled, unreconciledDates: recon.unreconciledDates, openingDenomTotals: recon.openingDenomTotals, denomTotals: recon.denomTotals, openingTotal: recon.openingTotal, cashTotal: recon.cashTotal, cashVarianceTotal: recon.cashVarianceTotal, upiActualTotal: recon.upiActualTotal, upiVarianceTotal: recon.upiVarianceTotal, cardActualTotal: recon.cardActualTotal, cardVarianceTotal: recon.cardVarianceTotal, cardDataAvailable: recon.cardDataAvailable },
    reconciliationNote: { reasonTag: "", detail: "" }
  };
}
// Dashboard's paymentMethodReconRows: Recorded vs Actual vs Variance; money figures from Recorded.
function admPaymentMethodReconRows(rec){
  const cr = rec.cashRecon || {};
  const recordedOf = (m) => (rec.payAgg && rec.payAgg[m]) || 0;
  const upiRecorded = recordedOf("UPI"), cashRecorded = recordedOf("Cash"), cardRecorded = recordedOf("Card"), pendingRecorded = recordedOf("Pending");
  const upiActual = cr.allReconciled ? (cr.upiActualTotal || 0) : upiRecorded;
  const cashActual = cr.allReconciled ? (cashRecorded + (cr.cashVarianceTotal || 0)) : cashRecorded;
  const cardActual = cr.cardDataAvailable ? (cr.cardActualTotal || 0) : cardRecorded;
  const rows = [
    { method: "UPI", recorded: upiRecorded, actual: upiActual },
    { method: "Cash", recorded: cashRecorded, actual: cashActual },
    { method: "Card", recorded: cardRecorded, actual: cardActual },
    { method: "Pending", recorded: pendingRecorded, actual: pendingRecorded }
  ].map(r => Object.assign(r, { variance: r.actual - r.recorded }));
  const totalRecorded = rows.reduce((a, r) => a + r.recorded, 0);
  const totalActual = rows.reduce((a, r) => a + r.actual, 0);
  const finalTotalRevenue = totalRecorded;
  const gstRegistered = !!admStmtCfg.gstEnabled;
  const gstRate = admStmtCfg.gstRate || 0;
  const baseRevenue = gstRegistered ? finalTotalRevenue / (1 + gstRate / 100) : finalTotalRevenue;
  const gstAmount = gstRegistered ? finalTotalRevenue - baseRevenue : 0;
  const finalMdShare = baseRevenue * (rec.mdSharePercent / 100);
  return { rows, totalRecorded, totalActual, totalVariance: totalActual - totalRecorded, finalTotalRevenue, gstRegistered, gstRate, baseRevenue, gstAmount, finalMdShare, finalOwnerShare: baseRevenue - finalMdShare };
}
function admFyBoundsFor(dateStr){
  const d = dateStr ? new Date(dateStr) : new Date();
  const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
  return { fyStartYear: y, from: `${y}-04-01`, to: `${y+1}-03-31`, label: `FY${y}-${String(y+1).slice(-2)}` };
}
// Dashboard's buildCumulativeRollupRows (page 2). Total Revenue per row = the recorded total, as there.
function admBuildCumulativeRollupRows(){
  const dates = mallShareSessions.map(s => s.date).sort();
  if (!dates.length) return [];
  const currentFY = admFyBoundsFor();
  const rows = [];
  const revenueOf = (from, to) => paymentMethodFinal(buildAdhocRec(from, to)).finalTotalRevenue;
  for (let y = admFyBoundsFor(dates[0]).fyStartYear; y < currentFY.fyStartYear; y++) {
    const from = `${y}-04-01`, to = `${y+1}-03-31`;
    const totalRevenue = revenueOf(from, to);
    const mallShare = mallShareForRange(from, to);
    if (totalRevenue === 0 && mallShare === 0) continue;
    const settled = settledAmountForRange(from, to);
    rows.push({ label: `FY${y}-${String(y+1).slice(-2)}`, isYearRow: true, totalRevenue, mallShare, settled, balance: mallShare - settled, sortKey: to });
  }
  const latestDate = dates[dates.length - 1];
  const latest = new Date(latestDate > todayStr() ? todayStr() : latestDate);
  let cursor = new Date(currentFY.from);
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  while (cursor <= latest) {
    const mFrom = todayStr(cursor);
    const mTo = todayStr(new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0));
    const totalRevenue = revenueOf(mFrom, mTo);
    const mallShare = mallShareForRange(mFrom, mTo);
    if (totalRevenue > 0 || mallShare > 0) {
      const settled = settledAmountForRange(mFrom, mTo);
      rows.push({ label: `${monthNames[cursor.getMonth()]} ${cursor.getFullYear()}`, isYearRow: false, totalRevenue, mallShare, settled, balance: mallShare - settled, sortKey: mTo });
    }
    cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
  }
  rows.sort((a, b) => b.sortKey.localeCompare(a.sortKey));
  return rows;
}
function admLoadImageDims(dataUrl){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}
function admPdfImageFormat(dataUrl){
  const m = /^data:image\/(\w+);base64/.exec(dataUrl || "");
  if (!m) return "PNG";
  const ext = m[1].toUpperCase();
  return ext === "JPG" ? "JPEG" : ext;
}

    XLSX.utils.sheet_add_json(ws, [{}, { A: "Cash Denomination" }], { origin: -1, skipHeader: true });
    XLSX.utils.sheet_add_json(ws, CASH_DENOMS.map(d => {
      const oc = openTotals[d] || 0, cc = closeTotals[d] || 0;
      return { Denomination: `Rs.${d}`, "Opening Count": oc, "Opening Total": oc * d, "Closing Count": cc, "Closing Total": cc * d, Difference: (cc - oc) * d };
    }), { origin: -1 });
    XLSX.utils.sheet_add_json(ws, [
      { A: "Total", C: openGrand, E: closeGrand, F: closeGrand - openGrand },
      { A: `Note: Difference total should match the day's Cash revenue (${rec.payAgg ? (rec.payAgg.Cash || 0) : 0}); any gap is a real physical cash short/over, same as the Cash Register variance.` }
    ], { origin: -1, skipHeader: true });
  } else if (rec.cashRecon) {
    XLSX.utils.sheet_add_json(ws, [{}, { A: `Physical cash denomination breakdown not included \u2014 reconciliation pending for: ${rec.cashRecon.unreconciledDates.join(", ")}.` }], { origin: -1, skipHeader: true });
  }
  XLSX.utils.sheet_add_json(ws, [
    {},
    { A: "Revenue Settlement Status", B: rec.status === "transferred"
        ? `Transferred via ${rec.transferMethod} (Ref: ${rec.transferReference || "-"}) on ${rec.transferDate}`
        : "Pending" }
  ], { origin: -1, skipHeader: true });
  XLSX.utils.book_append_sheet(wb, ws, "Revenue Share Statement");
  return wb;
}

async function receiptPdfBytes(sale){
  const api = window.jspdf.jsPDF.API, orig = api.save;

  api.save = function(n){ bytes = new Uint8Array(this.output("arraybuffer")); name = n; return this; };

async function shareOrDownloadFile(blob, filename, mime){
  const file = new File([blob], filename, { type: mime });
  if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return; } catch (e) {
      if (e && e.name === "AbortError") return;
      // iPhone only opens the Share sheet straight after a tap. If making the file took longer than
      // that, it refuses (NotAllowedError) -- so show one "Share" button to tap, which opens it.
      if (e && e.name === "NotAllowedError") { await offerTapToShare(file); return; }
    }
  }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function offerTapToShare(file){
  return new Promise(resolve => {
    const ov = document.createElement("div");
    ov.id = "tapToShareOverlay";
    ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;";
    ov.innerHTML = `<div style="background:#fff;color:#16332C;border-radius:10px;padding:18px;max-width:340px;width:100%;text-align:center;">
      <p style="margin:0 0 12px;font-size:15px;">${escapeHtml(file.name)} is ready.</p>
      <button class="btn btn-primary" id="tapToShareBtn">Share</button>
      <button class="btn btn-outline" id="tapToShareCancel" style="margin-left:8px;">Cancel</button></div>`;
    document.body.appendChild(ov);
    const done = () => { ov.remove(); resolve(); };
    ov.querySelector("#tapToShareCancel").addEventListener("click", done);
    ov.querySelector("#tapToShareBtn").addEventListener("click", async () => {
      try { await navigator.share({ files: [file], title: file.name }); } catch (e) {}
      done();
    });
  });
}

const CRC32_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
