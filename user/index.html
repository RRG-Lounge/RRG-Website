<style>
  :root{
    --pine: #16332C;
    --pine-2: #1F4A40;
    --pine-3: #0E211C;
    --cream: #F1E9D8;
    --cream-2: #E7DCC3;
    --copper: #C1703A;
    --copper-light: #DE9863;
    --ink: #16332C;
    --line: rgba(22,51,44,0.14);
    --max: min(96vw, 1800px);
  }
  * { box-sizing: border-box; }
  /* Fluid base size: this whole dashboard is read-only, viewed at everything from a phone to a
     large monitor, so text scales smoothly with viewport width instead of sitting at one fixed
     size -- ~15px on a small phone up to ~19px on a large desktop. Every size below is in rem,
     so it scales together with this. */
  html { font-size: clamp(15px, 0.55vw + 13.3px, 19px); }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  #root { max-width: var(--max); margin: 0 auto; min-height: 100vh; }
  .topbar, .tabs, .content { max-width: var(--max); margin-left: auto; margin-right: auto; }
  @media (min-width: 900px) {
    /* Operations tab's four summary panels sit side-by-side on wider screens; Receipts' one
       wide table panel is left alone -- it already uses the extra width itself. */
    #mainContent.op-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; align-items: start; }
    #mainContent.op-grid .panel { margin-bottom: 0; }
  }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px; box-shadow: 0 4px 24px rgba(22,51,44,0.08); }
  .login-brand { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.5rem; color: var(--pine); text-align: center; margin-bottom: 4px; }
  .login-sub { text-align: center; color: var(--pine-2); opacity: 0.75; font-size: 0.9rem; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.9rem; color: var(--pine-2); margin-bottom: 4px; }
  .field input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--cream); color: var(--ink); font-size: 1.1rem; font-family: 'Inter', sans-serif; }
  .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--copper); color: #fff; font-weight: 600; font-size: 1.1rem; cursor: pointer; font-family: 'Inter', sans-serif; }
  .btn:disabled { opacity: 0.5; }
  .login-error { color: #b3432f; font-size: 0.9rem; margin-top: 10px; text-align: center; min-height: 16px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 8px; gap: 12px; }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .topbar img.brand-logo { height: 2.4rem; width: auto; display: none; } /* shown via JS once a file is found */
  .topbar-titles { min-width: 0; }
  .topbar-titles .mall-name { font-family: 'Fraunces', serif; font-weight: 600; color: var(--pine); font-size: 1.4rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-titles .portal-label { color: var(--copper); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .topbar-user { text-align: right; }
  .topbar-user .user-name { color: var(--pine-2); font-size: 1rem; }
  .topbar button { background: transparent; border: 1px solid var(--line); color: var(--pine); padding: 8px 16px; border-radius: 6px; font-family: 'Inter', sans-serif; cursor: pointer; font-size: 0.95rem; }
  .mall-picker { background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 0.9rem; margin-top: 2px; font-family: 'Inter', sans-serif; }
  .content { padding: 8px 20px 40px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 16px; }
  .panel-title { font-family: 'Fraunces', serif; font-size: 1.35rem; font-weight: 600; color: var(--pine); margin-bottom: 6px; }
  .panel-help { font-size: 0.9rem; color: var(--pine-2); opacity: 0.75; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 1.05rem; }
  td, th { padding: 9px 6px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--pine-2); opacity: 0.7; font-size: 0.85rem; text-transform: uppercase; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 7px; }
  .dot-red { background: #b3432f; } .dot-amber { background: var(--copper-light); } .dot-green { background: #4a7a5e; }
  .tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .tab { padding: 10px 16px; color: var(--pine-2); opacity: 0.6; cursor: pointer; font-size: 1.05rem; border-bottom: 2px solid transparent; font-weight: 500; }
  .tab.active { color: var(--copper); opacity: 1; border-bottom-color: var(--copper); font-weight: 600; }
  .btn-small { padding: 7px 12px; font-size: 0.9rem; width: auto; display: inline-block; }
  .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--pine); }
  .btn-outline.qr-active { background: var(--copper); color: #fff; border-color: var(--copper); font-weight: 600; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-primary { background: var(--copper); color: #fff; border: none; }
  .btn-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
  .filter-field { display: flex; flex-direction: column; font-size: 0.85rem; color: var(--pine-2); opacity: 0.85; }
  .filter-field input, .filter-field select { margin-top: 3px; padding: 8px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--cream); color: var(--ink); font-size: 0.95rem; font-family: 'Inter', sans-serif; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .data-table td, .data-table th { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  .data-table th { color: var(--pine-2); opacity: 0.7; font-size: 0.8rem; text-transform: uppercase; }
  .receipt-actions { white-space: nowrap; }
  .receipt-actions .btn-small { margin-right: 4px; margin-bottom: 4px; }
  .table-scroll { overflow-x: auto; }
</style>

<body>
<div id="root"></div>
<script>
"use strict";

// This is a deliberately minimal, self-contained, READ-ONLY page -- built as its own file rather
// than reusing the full dashboard specifically so its source can safely sit in a public repo if
// needed (e.g. embedded into the relaxrechargego.com website): it contains no checkout, pricing,
// or write logic at all, nothing beyond what a Mall Admin is already meant to see. The actual
// security boundary is real Firebase Auth + Firestore Rules (server-side, role-checked) -- NOT
// keeping this file's source hidden. Critically: nothing on this page loads or renders until a
// real login (Staff ID + PIN) succeeds AND the account's role is verified to be mall_admin --
// unlike the older dashboard file, there is no bootstrap/auto-sign-in of any kind here.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA6BnYGNx3hKNcSxHgN9Wpyz6LkB_MUKq4",
  authDomain: "rrg-lounge-os.firebaseapp.com",
  projectId: "rrg-lounge-os",
  storageBucket: "rrg-lounge-os.firebasestorage.app",
  messagingSenderId: "1071966836969",
  appId: "1:1071966836969:web:e433f87d2d05748e573878"
};
firebase.initializeApp(FIREBASE_CONFIG);
const fbAuth = firebase.auth();
const fsDb = firebase.firestore();

const CASH_DENOMS = [500, 200, 100, 50, 20, 10, 5, 2, 1];
let liveConfig = { chairOrder: [], disabledUnits: [], unitTypes: {}, staff: [], businessName: "RRG Lounge", mdSharePercent: 30, gstEnabled: false, gstRate: 18, mdName: "" };
let sessionsToday = [], paymentSplitsToday = [], adjustmentsToday = [];
let unsubs = [];
let currentTab = "operations";

// ---------------------------------------------------------------------------
// Self-service branding -- same pattern as the main relaxrechargego.com site's
// Locations system: nothing here is hardcoded. Add/swap a mall by editing
// /malls.json (one entry: {id, name}) and dropping image files named
// <id>-mall-logo.<ext> into /assets/ -- no code changes, no redeploy of logic.
// Our own logo reuses the SAME file the main site already uses (/assets/rrg-logo.<ext>),
// so updating it once updates it everywhere.
// ---------------------------------------------------------------------------
const IMG_EXTS = ["png", "jpg", "jpeg", "webp"];
let mallsList = [];       // loaded from /malls.json
let selectedMallId = null; // which mall's branding is currently shown

function tryLoadImage(imgEl, basePath, extIndex){
  extIndex = extIndex || 0;
  if (extIndex >= IMG_EXTS.length) { imgEl.style.display = "none"; return; }
  imgEl.onerror = () => tryLoadImage(imgEl, basePath, extIndex + 1);
  imgEl.onload = () => {
    imgEl.style.display = "inline-block";
    // Record which extension actually loaded, so anything reusing this image later (e.g. adding
    // it to a PDF) knows its real format instead of assuming PNG -- passing the wrong format to
    // jsPDF's addImage decodes the bytes incorrectly and corrupts the image visually.
    imgEl.dataset.imgFormat = IMG_EXTS[extIndex] === "jpg" ? "JPEG" : IMG_EXTS[extIndex].toUpperCase();
  };
  imgEl.src = basePath + "." + IMG_EXTS[extIndex];
}

async function loadMallsList(){
  try {
    const res = await fetch("/malls.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("no malls.json");
    mallsList = await res.json();
  } catch (e) {
    mallsList = []; // fine -- branding just falls back to generic labels below
  }
}

function currentMall(){
  if (!mallsList.length) return null;
  return mallsList.find(m => m.id === selectedMallId) || mallsList[0];
}

function renderBranding(){
  const rrgLogoImg = document.getElementById("rrgLogoImg");
  if (rrgLogoImg) tryLoadImage(rrgLogoImg, "/assets/rrg-logo");

  const mall = currentMall();
  const mallLogoImg = document.getElementById("mallLogoImg");
  const mallNameEl = document.getElementById("mallNameLabel");
  if (mall) {
    if (mallLogoImg) tryLoadImage(mallLogoImg, "/assets/" + mall.id + "-mall-logo");
    if (mallNameEl) mallNameEl.textContent = mall.name;
  } else {
    if (mallLogoImg) mallLogoImg.style.display = "none";
    if (mallNameEl) mallNameEl.textContent = "RRG Lounge";
  }

  // Picker only ever appears once more than one mall is actually configured in
  // malls.json. NOTE: this currently only switches which mall's NAME/LOGO is shown --
  // real per-mall data separation is a separate backend project, not yet built.
  const pickerWrap = document.getElementById("mallPickerWrap");
  if (pickerWrap) pickerWrap.style.display = mallsList.length > 1 ? "block" : "none";
}

function currentStaffName(){
  const email = fbAuth.currentUser && fbAuth.currentUser.email;
  const staffId = email ? email.split("@")[0] : "";
  const rec = (liveConfig.staff || []).find(s => s.staffId === staffId);
  return (rec && rec.name) ? rec.name : staffId;
}

// Generic "show it's working" wrapper for any button whose click kicks off something that isn't
// instant (PDF/Excel generation, opening a print window) -- disables the button and swaps its
// label to "Processing..." for the duration, restores it after, even if the work throws.
async function withBusyButton(btn, fn){
  if (!btn) { await fn(); return; }
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Processing\u2026";
  // The heavy work below (jsPDF/SheetJS) runs synchronously and blocks the main thread --
  // without this, the browser batches the label change together with that work and never
  // actually paints "Processing..." until it's already done. Waiting two animation frames
  // guarantees a real paint happens first.
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  try {
    await fn();
  } catch (e) {
    alert("Something went wrong: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

// Highlights whichever quick-range button (Today/Yesterday/This Month, Last 1 Month, etc.) was
// just clicked, clearing the highlight from its siblings -- so it's visible which range is
// currently selected, the same way the top tabs show which tab is active.
function markActiveQuickRange(clickedBtn){
  if (!clickedBtn || !clickedBtn.parentElement) return;
  clickedBtn.parentElement.querySelectorAll(".qr-btn").forEach(b => b.classList.remove("qr-active"));
  clickedBtn.classList.add("qr-active");
}

function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function fmtMoney(n){ return "\u20B9" + Math.round(n||0).toLocaleString("en-IN"); }
function todayStr(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function fmtMMSS(totalSec){ const s = Math.max(0, totalSec); const m = Math.floor(s/60); const r = s%60; return String(m).padStart(2,"0") + ":" + String(r).padStart(2,"0"); }
function unitTypeOf(name){ if (liveConfig.unitTypes && liveConfig.unitTypes[name]) return liveConfig.unitTypes[name]; return name.startsWith("Leg") ? "Leg" : "Chair"; }
function activeChairOrder(){ const disabled = liveConfig.disabledUnits || []; return (liveConfig.chairOrder || []).filter(c => !disabled.includes(c)); }

function sessionEffectiveEndTs(s){
  const base = s.startTs + s.durationMin * 60000 + (s.pausedTotalMs || 0);
  return s.pauseStartedAt ? (base + (Date.now() - s.pauseStartedAt)) : base;
}
function getRunningSession(chairName){
  const rows = sessionsToday.filter(s => s.chairName === chairName && s.status === "running");
  if (!rows.length) return null;
  return rows.reduce((latest, s) => sessionEffectiveEndTs(s) > sessionEffectiveEndTs(latest) ? s : latest);
}
function chairAwaitingAcknowledgment(chairName){
  return sessionsToday.some(s => s.chairName === chairName && s.needsAcknowledgment);
}
function latestUnacknowledgedForChair(chairName){
  const rows = sessionsToday.filter(s => s.chairName === chairName && s.needsAcknowledgment);
  if (!rows.length) return null;
  return rows.reduce((a,b) => (a.endTs > b.endTs ? a : b));
}
function isChairInCart(){ return false; } // this page has no cart/checkout at all -- never true here
function adjustmentFor(invoiceNo){ return adjustmentsToday.find(a => a.invoiceNo === invoiceNo) || null; }
function paymentSplitFor(invoiceNo){ return paymentSplitsToday.find(p => p.invoiceNo === invoiceNo) || null; }
function collectedAmount(s){
  if (s.status === "cancelled") return (s.refunded || s.paymentStatus === "pending") ? 0 : s.amount;
  return s.paymentStatus === "paid" ? s.amount : 0;
}
function effectiveRevenue(s){
  if (s.status === "cancelled") return (s.refunded || s.paymentStatus === "pending") ? 0 : s.amount;
  return s.amount;
}
function adjustmentsTotalForSessions(sessions){
  const seen = new Set(); let total = 0;
  sessions.forEach(s => {
    if (s.invoiceNo && !seen.has(s.invoiceNo)) {
      seen.add(s.invoiceNo);
      const adj = adjustmentFor(s.invoiceNo);
      if (adj) total += adj.amount;
    }
  });
  return total;
}
// Normalizes any payment-method string (from a session, a split row, or an adjustment) to one
// of the three canonical buckets -- defends against a stray case/whitespace difference (e.g.
// "cash" vs "Cash") silently creating an invisible extra bucket that never shows on screen.
// Anything that genuinely isn't Cash/UPI/Card falls into "Other", which the table below DOES
// render if it's ever non-zero, rather than swallowing the amount without a trace.
function normalizePaymentMethod(m){
  const t = String(m || "").trim();
  const lower = t.toLowerCase();
  if (lower === "cash") return "Cash";
  if (lower === "upi") return "UPI";
  if (lower === "card") return "Card";
  return t || "Other";
}
function paymentMethodTotals(){
  const totals = { Cash: { amount: 0, count: 0 }, UPI: { amount: 0, count: 0 }, Card: { amount: 0, count: 0 } };

  // Group sessions by invoice first -- a single checkout can cover multiple chairs/items under
  // one invoiceNo, and every one of those line items has to be summed together before bucketing
  // by payment method. Treating each session row on its own (the earlier approach here) silently
  // dropped every line item after the first on any multi-item bill.
  const invoiceMap = {};
  const standalone = [];
  for (const s of sessionsToday) {
    if (s.invoiceNo) {
      if (!invoiceMap[s.invoiceNo]) invoiceMap[s.invoiceNo] = { method: s.method, sessions: [] };
      invoiceMap[s.invoiceNo].sessions.push(s);
    } else {
      standalone.push(s);
    }
  }
  const addTo = (methodRaw, amount, addCount) => {
    const key = normalizePaymentMethod(methodRaw);
    if (!totals[key]) totals[key] = { amount: 0, count: 0 };
    totals[key].amount += amount;
    if (addCount) totals[key].count += 1;
  };

  Object.keys(invoiceMap).forEach(invoiceNo => {
    const { method, sessions } = invoiceMap[invoiceNo];
    const collected = sessions.reduce((a, s) => a + collectedAmount(s), 0);
    // An adjustment corrects THIS invoice's own bill -- fold it into the same method bucket the
    // sale itself falls into, matching how the Receipts tab (and the real dashboard) attribute it.
    const adj = adjustmentFor(invoiceNo);
    const adjAmt = adj ? adj.amount : 0;
    if (collected <= 0 && adjAmt === 0) return;

    if (normalizePaymentMethod(method) === "Split") {
      const split = paymentSplitFor(invoiceNo);
      if (split) {
        split.splits.forEach(row => addTo(row.method, row.amount, true));
        // Best-effort: an adjustment on a split-paid invoice goes into the split's first
        // component bucket -- there's no single "right" bucket for a correction on a bill that
        // was itself paid across multiple methods.
        if (adjAmt && split.splits.length) addTo(split.splits[0].method, adjAmt, false);
      }
      return;
    }
    addTo(method, collected + adjAmt, true); // one count per INVOICE, not per line item
  });

  standalone.forEach(s => {
    const collected = collectedAmount(s);
    if (collected <= 0) return;
    addTo(s.method, collected, true);
  });

  return totals;
}

function buildLogin(errorMsg){
  unsubs.forEach(u => u()); unsubs = [];
  document.getElementById("root").innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-brand">RRG Lounge</div>
        <div class="login-sub">Mall Admin Portal</div>
        <div class="field"><label>Staff ID</label><input id="loginId" autocapitalize="off"></div>
        <div class="field"><label>PIN</label><input id="loginPin" type="password" inputmode="numeric"></div>
        <button class="btn" id="loginBtn">Login</button>
        <div class="login-error">${errorMsg ? escapeHtml(errorMsg) : ""}</div>
      </div>
    </div>`;
  document.getElementById("loginBtn").addEventListener("click", doLogin);
  document.getElementById("loginPin").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
}

async function doLogin(){
  const staffId = document.getElementById("loginId").value.trim();
  const pin = document.getElementById("loginPin").value;
  if (!staffId || !pin) { buildLogin("Enter your Staff ID and PIN."); return; }
  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  try {
    const cred = await fbAuth.signInWithEmailAndPassword(`${staffId}@rrglounge.local`, pin);
    const token = await cred.user.getIdTokenResult(true);
    if (token.claims.active !== true) { await fbAuth.signOut(); buildLogin("This account has been disabled."); return; }
    if (token.claims.role !== "mall_admin") { await fbAuth.signOut(); buildLogin("This login isn't a Mall Admin account. This page is for Mall Admin access only."); return; }
    await buildApp();
  } catch (e) {
    let msg = "Couldn't sign in. Please try again.";
    if (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential" || e.code === "auth/invalid-login-credentials") msg = "Incorrect PIN.";
    else if (e.code === "auth/user-not-found") msg = "Staff ID not found.";
    else if (e.code === "auth/network-request-failed") msg = "No internet connection.";
    buildLogin(msg);
  }
}

async function buildApp(){
  if (!mallsList.length) await loadMallsList();
  document.getElementById("root").innerHTML = `
    <div class="topbar">
      <div class="topbar-left">
        <img id="rrgLogoImg" class="brand-logo" alt="RRG Lounge">
        <div class="topbar-titles">
          <div class="mall-name" id="mallNameLabel">RRG Lounge</div>
          <div class="portal-label">Mall Admin Portal</div>
          <div id="mallPickerWrap" style="display:none;">
            <select class="mall-picker" id="mallPickerSelect"></select>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <img id="mallLogoImg" class="brand-logo" alt="">
        <div class="topbar-user">
          <div class="user-name" id="userNameLabel">\u2014</div>
          <button id="logoutBtn">Logout</button>
        </div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="operations">Operations</div>
      <div class="tab" data-tab="receipts">Receipts</div>
      <div class="tab" data-tab="mdshare">Mall Share</div>
    </div>
    <div class="content" id="mainContent"><p class="panel-help">Loading\u2026</p></div>`;

  document.querySelectorAll(".tab").forEach(tabEl => {
    tabEl.addEventListener("click", () => {
      currentTab = tabEl.dataset.tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tabEl));
      render();
    });
  });

  if (mallsList.length) {
    selectedMallId = selectedMallId || mallsList[0].id;
    const sel = document.getElementById("mallPickerSelect");
    sel.innerHTML = mallsList.map(m => `<option value="${escapeHtml(m.id)}">${escapeHtml(m.name)}</option>`).join("");
    sel.value = selectedMallId;
    sel.addEventListener("change", (e) => { selectedMallId = e.target.value; renderBranding(); });
  }
  renderBranding();
  document.getElementById("userNameLabel").textContent = currentStaffName();

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    unsubs.forEach(u => u()); unsubs = [];
    await fbAuth.signOut();
    buildLogin();
  });

  const today = todayStr();
  const invoicePrefixQuery = (collectionName) => fsDb.collection(collectionName)
    .where("invoiceNo", ">=", "RRG-FY").where("invoiceNo", "<", "RRG-FZ"); // narrows to this year's invoices; filtered further client-side by date below

  unsubs.push(fsDb.collection("meta").doc("config").onSnapshot(doc => {
    const config = (doc.data() || {}).value || {}; // stored as {key:"config", value:{...}}, not flat
    liveConfig = { chairOrder: config.chairOrder || [], disabledUnits: config.disabledUnits || [], unitTypes: config.unitTypes || {}, staff: config.staff || [], businessName: config.businessName || "RRG Lounge", mdSharePercent: (typeof config.mdSharePercent === "number") ? config.mdSharePercent : 30, gstEnabled: !!config.gstEnabled, gstRate: config.gstRate || 18, mdName: config.mdName || "" };
    const nameEl = document.getElementById("userNameLabel");
    if (nameEl) nameEl.textContent = currentStaffName(); // re-check now that the staff directory has loaded
    render();
  }));
  unsubs.push(fsDb.collection("sessions").where("date", "==", today).onSnapshot(snap => {
    sessionsToday = snap.docs.map(d => Object.assign({}, d.data(), { id: parseInt(d.id, 10) }));
    render();
  }));
  // paymentSplits/invoiceAdjustments aren't dated directly -- keyed by invoiceNo, which embeds
  // the date (e.g. RRG-FY26-09-01-004), so today's slice is found by prefix match instead of a
  // full-collection read.
  const invPrefix = `RRG-FY${today.slice(2,4)}-${today.slice(5,7)}-${today.slice(8,10)}`;
  unsubs.push(fsDb.collection("paymentSplits").where("invoiceNo", ">=", invPrefix).where("invoiceNo", "<", invPrefix + "\uf8ff").onSnapshot(snap => {
    paymentSplitsToday = snap.docs.map(d => d.data());
    render();
  }));
  unsubs.push(fsDb.collection("invoiceAdjustments").where("invoiceNo", ">=", invPrefix).where("invoiceNo", "<", invPrefix + "\uf8ff").onSnapshot(snap => {
    adjustmentsToday = snap.docs.map(d => d.data());
    render();
  }));
}

function render(){
  if (currentTab === "receipts") { renderReceiptsTab(); return; }
  if (currentTab === "mdshare") { renderMallShareTab(); return; }
  renderOperationsTab();
}

function renderOperationsTab(){
  const el = document.getElementById("mainContent");
  if (!el) return;
  el.classList.add("op-grid");
  const today = todayStr();

  const rows = activeChairOrder().map(chairName => {
    const running = getRunningSession(chairName);
    if (running) {
      const remainSec = Math.max(0, Math.round((sessionEffectiveEndTs(running) - Date.now())/1000));
      const paused = !!running.pauseStartedAt;
      return `<tr><td>${escapeHtml(chairName)}</td><td><span class="dot dot-red"></span>Running${paused ? " (Paused)" : ""}</td><td>${running.durationMin}m</td><td>${fmtMMSS(remainSec)}</td></tr>`;
    }
    if (chairAwaitingAcknowledgment(chairName)) {
      const s = latestUnacknowledgedForChair(chairName);
      const overdueSec = Math.max(0, Math.round((Date.now() - s.endTs) / 1000));
      return `<tr><td>${escapeHtml(chairName)}</td><td><span class="dot dot-red"></span>\u23f0 Time's Up (${fmtMMSS(overdueSec)} ago)</td><td>${s.durationMin}m</td><td>-</td></tr>`;
    }
    return `<tr><td>${escapeHtml(chairName)}</td><td><span class="dot dot-green"></span>Available</td><td>-</td><td>-</td></tr>`;
  }).join("");

  const completed = sessionsToday.filter(s => s.status === "completed").length;
  const runningCount = sessionsToday.filter(s => s.status === "running").length;
  const revenue = sessionsToday.reduce((a,s) => a + effectiveRevenue(s), 0) + adjustmentsTotalForSessions(sessionsToday);
  const methodTotals = paymentMethodTotals();
  // Render every bucket that actually exists (Cash/UPI/Card always shown even at zero; anything
  // unexpected -- e.g. a mismatched method string on an adjustment -- shows as its own row instead
  // of silently vanishing). Total is summed across ALL buckets, so it can never drift from Revenue.
  const knownOrder = ["Cash", "UPI", "Card"];
  const extraKeys = Object.keys(methodTotals).filter(k => !knownOrder.includes(k)).sort();
  const methodRowOrder = knownOrder.concat(extraKeys);
  const methodRows = methodRowOrder.map(k => `<tr><td>${escapeHtml(k)}</td><td>${methodTotals[k].count}</td><td>${fmtMoney(methodTotals[k].amount)}</td></tr>`).join("");
  const grandCount = methodRowOrder.reduce((a,k) => a + methodTotals[k].count, 0);
  const grandAmount = methodRowOrder.reduce((a,k) => a + methodTotals[k].amount, 0);

  el.innerHTML = `
    <div class="panel">
      <div class="panel-title">Live Chair Status</div>
      <p class="panel-help">View-only.</p>
      <table><thead><tr><th>Unit</th><th>Status</th><th>Package</th><th>Remaining</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="panel">
      <div class="panel-title">Today's Summary</div>
      <table>
        <tr><td>Customers Today</td><td>${sessionsToday.length}</td></tr>
        <tr><td>Running Sessions</td><td>${runningCount}</td></tr>
        <tr><td>Completed Sessions</td><td>${completed}</td></tr>
        <tr><td><b>Today's Revenue</b></td><td><b>${fmtMoney(revenue)}</b></td></tr>
      </table>
    </div>
    <div class="panel">
      <div class="panel-title">Payment Method Breakdown \u2014 Today</div>
      <table>
        <thead><tr><th>Method</th><th>Transactions</th><th>Amount</th></tr></thead>
        <tbody>
          ${methodRows}
          <tr><td><b>Total Collected</b></td><td><b>${grandCount}</b></td><td><b>${fmtMoney(grandAmount)}</b></td></tr>
        </tbody>
      </table>
    </div>
  `;
}

/* ========================= RECEIPTS TAB (view/Print/PDF only) =========================
   Mirrors the exact read-only behaviour already proven for role "mall_admin" in the main
   Lounge OS dashboard: no edit fields, no Adjust/Save-method buttons -- just look up a past
   bill, print it, or save it as a PDF. Same underlying figures (adjustments, splits) as the
   real dashboard so nothing here can show a different number than what staff actually see. */

function tokenTypeLabel(unitType){
  if (unitType === "Leg") return "Foot";
  if (unitType === "Advanced Leg") return "Adv. Foot";
  return "Body";
}
function massagerNameFor(unitType){ return tokenTypeLabel(unitType) + " Massager"; }
function cartItemName(chairName, packageLabel, unitTypeFallback){
  const type = chairName != null ? unitTypeOf(chairName) : (unitTypeFallback || "Chair");
  return massagerNameFor(type) + "-" + packageLabel;
}
function tokenItemDisplayName(item){
  if (item.chairName != null) return cartItemName(item.chairName, item.packageLabel);
  return massagerNameFor(item.unitType) + "-" + item.packageLabel;
}
function groupCartItemsClean(items){
  const map = {}; const order = [];
  items.forEach(it => {
    const name = tokenItemDisplayName(it);
    const key = name + "|" + it.price;
    if (!map[key]) { map[key] = { name, rate: it.price, qty: 0, subtotal: 0 }; order.push(key); }
    map[key].qty += 1;
    map[key].subtotal += it.price;
  });
  return order.map(k => map[k]);
}
function splitMethodLabel(split){
  if (!split) return "Split";
  return split.splits.filter(s => s.amount > 0).map(s => `${s.method} ${fmtMoney(s.amount)}`).join(" + ");
}
function dmy(d = new Date()){
  const pad2 = n => String(n).padStart(2,"0");
  return pad2(d.getDate()) + "/" + pad2(d.getMonth()+1) + "/" + d.getFullYear();
}
function timeStr(d = new Date()){
  const pad2 = n => String(n).padStart(2,"0");
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
}
function fmtMoneyPDF(n){ return "Rs." + Math.round(n||0).toLocaleString("en-IN"); }
function pdfSafeText(v){
  if (v === null || v === undefined) return v;
  if (typeof v !== "string") return v;
  return v
    .replace(/\u2192/g, "->").replace(/\u2190/g, "<-")
    .replace(/[\u2013\u2014]/g, "-").replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201c\u201d]/g, '"').replace(/\u2026/g, "...")
    .replace(/[^\x00-\x7F]/g, "");
}
function gstBreakup(amount, rate){
  const taxable = amount / (1 + rate/100);
  const totalTax = amount - taxable;
  return { taxable, cgst: totalTax/2, sgst: totalTax/2 };
}

// ---- Receipts data (loaded on demand, NOT a permanent listener -- avoids an ever-growing
// full-history read cost; only the currently selected filter's range is ever fetched) ----
let receiptsSessions = [], receiptsSplits = [], receiptsAdjustments = [], receiptsTxnRefs = [];
let receiptsLoadedRange = null; // {from, to} of what's currently loaded, so we don't re-fetch needlessly
let receiptsFilterFrom = null, receiptsFilterTo = null, receiptsSearchInvoice = "";
let receiptsFilterYear = "", receiptsFilterMonth = "", receiptsFilterPaymentType = "";

function invNoPrefix(dateStr){ return `RRG-FY${dateStr.slice(2,4)}-${dateStr.slice(5,7)}-${dateStr.slice(8,10)}`; }

// Invoice numbers embed the date (RRG-FYyy-mm-dd-seq) and sort lexicographically WITHIN a
// calendar year -- this range fetch is reliable for any range inside one calendar year (the
// common case: Today, a month, a custom recent range). A range crossing a Dec->Jan boundary
// can miss rows because "mm" resets past "dd" ordering -- flagged here rather than silently
// risking a wrong/incomplete receipts list; ask before relying on this for a Dec-Jan range.
async function loadReceiptsRange(from, to){
  const fromPrefix = invNoPrefix(from), toPrefix = invNoPrefix(to);
  const [sessSnap, splitSnap, adjSnap, refSnap] = await Promise.all([
    fsDb.collection("sessions").where("date", ">=", from).where("date", "<=", to).get(),
    fsDb.collection("paymentSplits").where("invoiceNo", ">=", fromPrefix).where("invoiceNo", "<", toPrefix + "\uf8ff").get(),
    fsDb.collection("invoiceAdjustments").where("invoiceNo", ">=", fromPrefix).where("invoiceNo", "<", toPrefix + "\uf8ff").get(),
    fsDb.collection("txnRefs").where("invoiceNo", ">=", fromPrefix).where("invoiceNo", "<", toPrefix + "\uf8ff").get()
  ]);
  receiptsSessions = sessSnap.docs.map(d => Object.assign({}, d.data(), { id: parseInt(d.id, 10) }));
  receiptsSplits = splitSnap.docs.map(d => d.data());
  receiptsAdjustments = adjSnap.docs.map(d => d.data());
  receiptsTxnRefs = refSnap.docs.map(d => d.data());
  receiptsLoadedRange = { from, to };
}

function receiptAdjustmentFor(invoiceNo){ return receiptsAdjustments.find(a => a.invoiceNo === invoiceNo) || null; }
function receiptSplitFor(invoiceNo){ return receiptsSplits.find(p => p.invoiceNo === invoiceNo) || null; }
function receiptTxnRefFor(invoiceNo){ const r = receiptsTxnRefs.find(x => x.invoiceNo === invoiceNo); return r ? r.ref : ""; }

function sessionItemLabel(s){
  const base = `${cartItemName(s.chairName, s.packageLabel, s.unitType)} (${s.chairName || "unassigned"})`;
  if (s.status === "cancelled") return `${base} [${s.refunded ? "Cancelled-Refunded" : "Cancelled-Kept"}]`;
  return base;
}
function invoicesFromSessions(){
  const map = {}; const order = [];
  for (const s of receiptsSessions) {
    if (!s.invoiceNo) continue;
    if (!map[s.invoiceNo]) {
      const checkoutTs = new Date(s.date + "T" + s.time).getTime() || Date.now();
      map[s.invoiceNo] = { invoiceNo: s.invoiceNo, date: s.date, time: s.time, startTs: checkoutTs, staff: s.staff, method: s.method, gst: s.gst, customerName: s.customerName || null, sessions: [] };
      order.push(s.invoiceNo);
    }
    map[s.invoiceNo].sessions.push(s);
  }
  return order.map(k => map[k]).sort((a,b) => b.startTs - a.startTs);
}
function invoiceToSaleObject(inv){
  const activeSessions = inv.sessions.filter(s => s.status !== "cancelled");
  const cancelledSessions = inv.sessions.filter(s => s.status === "cancelled");
  const priced = activeSessions.map(s => ({ chairName: s.chairName, packageLabel: s.packageLabel, price: s.amount, unitType: s.unitType }));
  const items = groupCartItemsClean(priced);
  cancelledSessions.forEach(s => {
    const tag = s.refunded ? "Cancelled - Refunded" : "Cancelled - Kept";
    items.push({ name: `${tokenItemDisplayName(s)} (${tag})`, rate: s.refunded ? 0 : s.amount, qty: 1, subtotal: s.refunded ? 0 : s.amount });
  });
  const baseTotal = inv.sessions.reduce((a,s) => a + effectiveRevenue(s), 0);
  const adj = receiptAdjustmentFor(inv.invoiceNo);
  if (adj) items.push({ name: adj.label, rate: adj.amount, qty: 1, subtotal: adj.amount });
  const total = baseTotal + (adj ? adj.amount : 0);
  const split = inv.method === "Split" ? receiptSplitFor(inv.invoiceNo) : null;
  return { invoiceNo: inv.invoiceNo, date: inv.date, time: inv.time, startTs: inv.startTs, staff: inv.staff, method: inv.method, methodDisplay: split ? splitMethodLabel(split) : inv.method, gst: inv.gst, items, total, customerName: inv.customerName || null };
}
function currentFilteredInvoices(){
  return invoicesFromSessions().filter(inv => {
    if (receiptsFilterYear !== "" || receiptsFilterMonth !== "") {
      if (receiptsFilterYear !== "" && inv.date.slice(0,4) !== String(receiptsFilterYear)) return false;
      if (receiptsFilterMonth !== "" && (parseInt(inv.date.slice(5,7),10) - 1) !== parseInt(receiptsFilterMonth,10)) return false;
    } else {
      if (inv.date < receiptsFilterFrom || inv.date > receiptsFilterTo) return false;
    }
    if (receiptsSearchInvoice) {
      const q = receiptsSearchInvoice.toLowerCase();
      const matchesInvoice = inv.invoiceNo.toLowerCase().includes(q);
      const matchesCustomer = inv.customerName && inv.customerName.toLowerCase().includes(q);
      const matchesTxnRef = receiptTxnRefFor(inv.invoiceNo).toLowerCase().includes(q);
      if (!matchesInvoice && !matchesCustomer && !matchesTxnRef) return false;
    }
    if (receiptsFilterPaymentType && inv.method !== receiptsFilterPaymentType) return false;
    return true;
  });
}
function receiptsFilterLabel(){
  const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const parts = [];
  if (receiptsFilterMonth !== "") parts.push(MONTH_ABBR[parseInt(receiptsFilterMonth,10)]);
  if (receiptsFilterYear !== "") parts.push(receiptsFilterYear);
  if (parts.length) return parts.join("_");
  return `${receiptsFilterFrom}_to_${receiptsFilterTo}`;
}

function exportReceiptPDFSimple(sale){

  doc.text(pdfSafeText(liveConfig.businessName || "RRG Lounge"), 74, y, { align: "center" }); y += 8;
  doc.setLineWidth(0.2); doc.line(10, y, rightX, y); y += 6;
  doc.setFont("courier","normal"); doc.setFontSize(10);

function exportReceiptsExcel(){
  const invoices = currentFilteredInvoices();
  if (!invoices.length) { alert("No receipts match the current filter."); return; }
  const rows = invoices.map(inv => {
    const baseTotal = inv.sessions.reduce((a,s) => a + effectiveRevenue(s), 0);
    const adj = receiptAdjustmentFor(inv.invoiceNo);
    const total = baseTotal + (adj ? adj.amount : 0);
    const split = inv.method === "Split" ? receiptSplitFor(inv.invoiceNo) : null;
    return {
      Invoice: inv.invoiceNo, Date: inv.date, Time: inv.time,
      Customer: inv.customerName || "", "Txn Ref": receiptTxnRefFor(inv.invoiceNo) || "",
      Items: inv.sessions.map(sessionItemLabel).join(", "), Total: total,

    };

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Receipts");
  XLSX.writeFile(wb, `Receipts_${receiptsFilterLabel()}.xlsx`);
}

/* ========================= MALL SHARE TAB (view/export only) =========================
   Same read-only scope already proven for role "mall_admin" in the main dashboard: Overview,
   Daily Performance Summary, Revenue Share Report, Settlement Report. No Log a Settlement, no
   Settlement History -- those stay internal to RRG Lounge's own dashboard.
   Simplified from the source dashboard in one deliberate way: the cash-reconciliation
   "recorded vs actual (bank-matched) vs variance" system is NOT ported here, because the real
   money figures (Revenue/GST/Mall Share/Owner Share) are computed from RECORDED amounts either
   way -- reconciliation only ever affected a variance column, never the actual owed amount. */

function dmyShort(dateStr){
  const [y,m,d] = dateStr.split("-");
  return `${d}-${m}-${y.slice(2)}`;
}

let mallShareSessions = [], mallShareAdjustments = [], mallShareSplits = [], mallShareSettlements = [];
let mallShareLoaded = false;

async function loadMallShareData(){
  const [sessSnap, adjSnap, splitSnap, settleSnap] = await Promise.all([
    fsDb.collection("sessions").get(),
    fsDb.collection("invoiceAdjustments").get(),
    fsDb.collection("paymentSplits").get(),
    fsDb.collection("shareSettlements").get()
  ]);
  mallShareSessions = sessSnap.docs.map(d => Object.assign({}, d.data(), { id: parseInt(d.id, 10) }));
  mallShareAdjustments = adjSnap.docs.map(d => d.data());
  mallShareSplits = splitSnap.docs.map(d => d.data());
  mallShareSettlements = settleSnap.docs.map(d => d.data());
  mallShareLoaded = true;
}
function msAdjustmentFor(invoiceNo){ return mallShareAdjustments.find(a => a.invoiceNo === invoiceNo) || null; }
function msSplitFor(invoiceNo){ return mallShareSplits.find(p => p.invoiceNo === invoiceNo) || null; }

function computeMdSummary(from, to){
  const rows = mallShareSessions.filter(s => s.date >= from && s.date <= to);
  const unitsUsed = new Set(rows.map(s => s.chairName).filter(Boolean)).size;
  let totalRevenue = rows.reduce((a,s) => a + effectiveRevenue(s), 0);

  const pkgAgg = {}; const pkgOrder = [];
  rows.forEach(s => {
    const key = cartItemName(s.chairName, s.packageLabel, s.unitType);
    if (!pkgAgg[key]) { pkgAgg[key] = { count: 0, revenue: 0 }; pkgOrder.push(key); }
    pkgAgg[key].count++;
    pkgAgg[key].revenue += effectiveRevenue(s);
  });

  const payAgg = { UPI: 0, Cash: 0, Card: 0, Pending: 0 };
  const seenSplitInvoices = new Set();
  rows.forEach(s => {
    const rev = effectiveRevenue(s);
    if (rev <= 0) return;
    if (s.method === "Split") {
      if (!s.invoiceNo || seenSplitInvoices.has(s.invoiceNo)) return;
      seenSplitInvoices.add(s.invoiceNo);
      const split = msSplitFor(s.invoiceNo);
      if (split) split.splits.forEach(row => { payAgg[row.method] = (payAgg[row.method] || 0) + row.amount; });
      return;
    }
    if (!(s.method in payAgg)) payAgg[s.method] = 0;
    payAgg[s.method] += rev;
  });

  const seenAdjInvoices = new Set();
  rows.forEach(s => {
    if (!s.invoiceNo || seenAdjInvoices.has(s.invoiceNo)) return;
    const adj = msAdjustmentFor(s.invoiceNo);
    if (!adj) return;
    seenAdjInvoices.add(s.invoiceNo);
    totalRevenue += adj.amount;
    if (!pkgAgg[adj.label]) { pkgAgg[adj.label] = { count: 0, revenue: 0 }; pkgOrder.push(adj.label); }
    pkgAgg[adj.label].count++;
    pkgAgg[adj.label].revenue += adj.amount;
    payAgg[adj.method] = (payAgg[adj.method] || 0) + adj.amount;
  });

  const mdSharePercent = liveConfig.mdSharePercent;
  const mdShare = totalRevenue * (mdSharePercent / 100);
  const ownerShare = totalRevenue - mdShare;
  return { totalSessions: rows.length, unitsUsed, totalRevenue, pkgAgg, pkgOrder, payAgg, mdSharePercent, mdShare, ownerShare };
}

// Same money math the dashboard uses -- recorded amounts, not a bank-reconciled "actual" figure
// (see file header note above for why that's correct, not a simplification of the real number).
function paymentMethodFinal(rec){
  const totalRecorded = ["UPI","Cash","Card","Pending"].reduce((a,m) => a + (rec.payAgg[m] || 0), 0);
  const gstRegistered = !!liveConfig.gstEnabled;
  const gstRate = liveConfig.gstRate || 0;
  const baseRevenue = gstRegistered ? totalRecorded / (1 + gstRate/100) : totalRecorded;
  const gstAmount = gstRegistered ? totalRecorded - baseRevenue : 0;
  const finalMdShare = baseRevenue * (rec.mdSharePercent / 100);
  const finalOwnerShare = baseRevenue - finalMdShare;
  return { finalTotalRevenue: totalRecorded, gstRegistered, gstRate, baseRevenue, gstAmount, finalMdShare, finalOwnerShare };
}
function buildAdhocRec(from, to){
  const s = computeMdSummary(from, to);
  return { periodFrom: from, periodTo: to, totalSessions: s.totalSessions, unitsUsed: s.unitsUsed, pkgOrder: s.pkgOrder, pkgAgg: s.pkgAgg, payAgg: s.payAgg, totalRevenue: s.totalRevenue, mdSharePercent: s.mdSharePercent, mdShareAmount: s.mdShare, ownerShareAmount: s.ownerShare };
}
function mallShareForRange(from, to){
  if (from > to) return 0;
  return paymentMethodFinal(buildAdhocRec(from, to)).finalMdShare;
}
function settledAmountForRange(from, to){
  let total = 0;
  for (const r of mallShareSettlements) {
    if (r.status !== "transferred") continue;
    const oFrom = r.periodFrom > from ? r.periodFrom : from;
    const oTo = r.periodTo < to ? r.periodTo : to;
    if (oFrom > oTo) continue;
    const fullOwedForSettlement = mallShareForRange(r.periodFrom, r.periodTo);
    const ratio = fullOwedForSettlement > 0 ? Math.min(1, (r.mdShareAmount || 0) / fullOwedForSettlement) : 0;
    total += mallShareForRange(oFrom, oTo) * ratio;
  }
  return total;
}
function unsettledAmountForRange(from, to){
  const raw = mallShareForRange(from, to) - settledAmountForRange(from, to);
  const rounded = Math.round(raw * 100) / 100;
  return rounded > 1 ? rounded : 0;
}
function isRangeFullySettled(from, to){ return unsettledAmountForRange(from, to) < 0.5; }
function latestCoveringSettlement(from, to){
  const covering = mallShareSettlements.filter(r => r.status === "transferred" && !(to < r.periodFrom || from > r.periodTo)).sort((a,b) => (b.transferDate||"").localeCompare(a.transferDate||""));
  return covering[0] || null;
}
function settlementsInBusinessPeriod(from, to){
  return mallShareSettlements.filter(r => r.status === "transferred" && !(r.periodTo < from || r.periodFrom > to)).sort((a,b) => (a.periodFrom||"").localeCompare(b.periodFrom||""));
}

// Adds our logo (left) and the mall's logo (right) to a jsPDF doc, reusing the SAME <img>
// elements already loaded in the top bar -- no separate base64 config needed.
// Re-encodes any loaded <img> (regardless of its original format -- webp, jpg, whatever) into a
// PNG data URL via canvas. jsPDF's addImage only understands PNG/JPEG natively; webp specifically
// isn't supported at all, so passing it straight through corrupts or silently drops the image.
// Going through canvas sidesteps the format question entirely -- the browser decodes the source
// image (webp decoding is a normal browser capability), and toDataURL always re-encodes as PNG.
function imageToPngDataUrl(imgEl){
  try {
    const canvas = document.createElement("canvas");
    canvas.width = imgEl.naturalWidth;
    canvas.height = imgEl.naturalHeight;
    canvas.getContext("2d").drawImage(imgEl, 0, 0);
    return canvas.toDataURL("image/png");
  } catch (e) { return null; }
}

function addPdfLogos(doc, y, pageWidth){
  const logoH = 13;
  const rrgImg = document.getElementById("rrgLogoImg");
  const mallImg = document.getElementById("mallLogoImg");
  let used = false;
  if (rrgImg && rrgImg.style.display !== "none" && rrgImg.naturalWidth) {
    const dataUrl = imageToPngDataUrl(rrgImg);
    if (dataUrl) {
      const w = logoH * (rrgImg.naturalWidth / rrgImg.naturalHeight);
      try { doc.addImage(dataUrl, "PNG", 14, y, w, logoH); used = true; } catch(e) {}
    }
  }
  if (mallImg && mallImg.style.display !== "none" && mallImg.naturalWidth) {
    const dataUrl = imageToPngDataUrl(mallImg);
    if (dataUrl) {
      const w = logoH * (mallImg.naturalWidth / mallImg.naturalHeight);
      try { doc.addImage(dataUrl, "PNG", pageWidth - 14 - w, y, w, logoH); used = true; } catch(e) {}
    }
  }
  return used ? y + logoH + 5 : y;
}

    ],

    document.getElementById("rsrPreview").innerHTML = `
      <table class="data-table">
        <tr><td>Period</td><td>${dmyShort(from)} to ${dmyShort(to)}</td></tr>
        <tr><td>Total Revenue</td><td>${fmtMoney(fin.finalTotalRevenue)}</td></tr>
        <tr><td>Mall Share (${fin.finalTotalRevenue ? Math.round(fin.finalMdShare/fin.baseRevenue*100) : liveConfig.mdSharePercent}%)</td><td>${fmtMoney(fin.finalMdShare)}</td></tr>
        <tr><td>Settlement Status</td><td>${settled ? "\u2705 Settled" : "\u26A0 Pending"}</td></tr>
      </table>${settledWhy}`;
  }
  renderRsrPreview();
  document.getElementById("rsrFrom").addEventListener("change", renderRsrPreview);
  document.getElementById("rsrTo").addEventListener("change", renderRsrPreview);
  document.getElementById("rsrToday").addEventListener("click", (e) => { markActiveQuickRange(e.target); document.getElementById("rsrFrom").value = todayS; document.getElementById("rsrTo").value = todayS; renderRsrPreview(); });
  document.getElementById("rsrYesterday").addEventListener("click", (e) => { markActiveQuickRange(e.target); const y = new Date(); y.setDate(y.getDate()-1); const ys = todayStrFromDate(y); document.getElementById("rsrFrom").value = ys; document.getElementById("rsrTo").value = ys; renderRsrPreview(); });
  document.getElementById("rsrWeek").addEventListener("click", (e) => { markActiveQuickRange(e.target); const now = new Date(); const ws = new Date(now.getFullYear(), now.getMonth(), now.getDate()-now.getDay()); document.getElementById("rsrFrom").value = todayStrFromDate(ws); document.getElementById("rsrTo").value = todayS; renderRsrPreview(); });
  document.getElementById("rsrMonth").addEventListener("click", (e) => { markActiveQuickRange(e.target); const now = new Date(); document.getElementById("rsrFrom").value = todayStrFromDate(new Date(now.getFullYear(), now.getMonth(), 1)); document.getElementById("rsrTo").value = todayS; renderRsrPreview(); });
  document.getElementById("rsrExportPdfBtn").addEventListener("click", (e) => withBusyButton(e.target, async () => { const from = document.getElementById("rsrFrom").value || earliest; const to = document.getElementById("rsrTo").value || todayS; exportRevenueShareStatementPDF(buildAdhocRec(from, to)); }));
  document.getElementById("rsrExportExcelBtn").addEventListener("click", (e) => withBusyButton(e.target, async () => { const from = document.getElementById("rsrFrom").value || earliest; const to = document.getElementById("rsrTo").value || todayS; exportRevenueShareStatementExcel(buildAdhocRec(from, to)); }));

  document.getElementById("srLast1Month").addEventListener("click", (e) => { markActiveQuickRange(e.target); const now = new Date(); document.getElementById("srFrom").value = todayStrFromDate(new Date(now.getFullYear(), now.getMonth()-1, now.getDate())); document.getElementById("srTo").value = todayS; });
  document.getElementById("srLast3Months").addEventListener("click", (e) => { markActiveQuickRange(e.target); const now = new Date(); document.getElementById("srFrom").value = todayStrFromDate(new Date(now.getFullYear(), now.getMonth()-3, now.getDate())); document.getElementById("srTo").value = todayS; });
  document.getElementById("srLast6Months").addEventListener("click", (e) => { markActiveQuickRange(e.target); const now = new Date(); document.getElementById("srFrom").value = todayStrFromDate(new Date(now.getFullYear(), now.getMonth()-6, now.getDate())); document.getElementById("srTo").value = todayS; });
  document.getElementById("srLast1Year").addEventListener("click", (e) => { markActiveQuickRange(e.target); const now = new Date(); document.getElementById("srFrom").value = todayStrFromDate(new Date(now.getFullYear()-1, now.getMonth(), now.getDate())); document.getElementById("srTo").value = todayS; });
  document.getElementById("srAll").addEventListener("click", (e) => { markActiveQuickRange(e.target); document.getElementById("srFrom").value = earliest; document.getElementById("srTo").value = todayS; });
  document.getElementById("srExportPdfBtn").addEventListener("click", (e) => withBusyButton(e.target, async () => { const from = document.getElementById("srFrom").value || earliest; const to = document.getElementById("srTo").value || todayS; exportSettlementReportPDF(from, to, settlementsInBusinessPeriod(from, to)); }));
  document.getElementById("srExportExcelBtn").addEventListener("click", (e) => withBusyButton(e.target, async () => { const from = document.getElementById("srFrom").value || earliest; const to = document.getElementById("srTo").value || todayS; exportSettlementReportExcel(from, to, settlementsInBusinessPeriod(from, to)); }));
}
function todayStrFromDate(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }

window.addEventListener("DOMContentLoaded", () => {
  fbAuth.onAuthStateChanged(async (user) => {
    if (!user) { buildLogin(); return; }
    try {
      const token = await user.getIdTokenResult(true);
      if (token.claims.active !== true || token.claims.role !== "mall_admin") { await fbAuth.signOut(); buildLogin(); return; }
      await buildApp();
    } catch (e) { await fbAuth.signOut(); buildLogin(); }
  });
});
</script>
